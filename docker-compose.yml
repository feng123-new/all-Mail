name: ${COMPOSE_PROJECT_NAME:-all-mail}

x-allmail-hardening: &allmail-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  user: "10001:10001"

x-go-runtime: &go-runtime
  <<: *allmail-hardening
  image: ${ALL_MAIL_GO_IMAGE:-all-mail-go}:${ALL_MAIL_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  app:
    <<: *go-runtime
    command: ["api"]
    ports:
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PORT:-3002}:3000"
    environment:
      PORT: 3000
      ALL_MAIL_STATIC_DIR: /app/public
      GO_BUSINESS_API_URL: http://go-business-api:3200
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      GO_BUSINESS_QUERY_TIMEOUT_SECONDS: 10
      MAIL_PROVIDER_TIMEOUT_SECONDS: ${MAIL_PROVIDER_TIMEOUT_SECONDS:-300}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      go-business-api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - public-network
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  go-business-api:
    <<: *go-runtime
    command: ["business-api"]
    environment:
      NODE_ENV: production
      PORT: 3200
      DATABASE_URL_FILE: /var/lib/all-mail-database/api-url
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /var/lib/all-mail-redis/redis-password
      JWT_SECRET_FILE: /var/lib/all-mail-secrets/jwt-secret
      ENCRYPTION_KEY_FILE: /var/lib/all-mail-encryption/encryption-key
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-15}
      ADMIN_2FA_WINDOW: ${ADMIN_2FA_WINDOW:-1}
      BOOTSTRAP_ADMIN_SECRET_FILE: /var/lib/all-mail/bootstrap-admin.env
      INGRESS_ALLOWED_SKEW_SECONDS: ${INGRESS_ALLOWED_SKEW_SECONDS:-300}
      GO_BUSINESS_QUERY_TIMEOUT_SECONDS: 10
      MAIL_PROVIDER_TIMEOUT_SECONDS: ${MAIL_PROVIDER_TIMEOUT_SECONDS:-300}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - bootstrap_admin_data:/var/lib/all-mail
      - go_business_runtime_data:/var/lib/all-mail-secrets:ro
      - forwarding_runtime_data:/var/lib/all-mail-encryption:ro
      - redis_runtime_data:/var/lib/all-mail-redis:ro
      - database_runtime_data:/var/lib/all-mail-database:ro
    networks:
      - app-network
      - provider-network
      - database-network
      - cache-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "business-api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker-forwarding:
    <<: *go-runtime
    command: ["worker", "forwarding"]
    environment:
      ALL_MAIL_STATE_DIR: /tmp/all-mail
      ENCRYPTION_KEY_FILE: /var/lib/all-mail-secrets/encryption-key
      DATABASE_URL_FILE: /var/lib/all-mail-database/forwarding-url
      FORWARDING_WORKER_INTERVAL_SECONDS: ${FORWARDING_WORKER_INTERVAL_SECONDS:-30}
      FORWARDING_WORKER_BATCH_SIZE: ${FORWARDING_WORKER_BATCH_SIZE:-10}
      FORWARDING_RUN_TIMEOUT_SECONDS: ${FORWARDING_RUN_TIMEOUT_SECONDS:-120}
      FORWARDING_LEASE_SECONDS: ${FORWARDING_LEASE_SECONDS:-180}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-90}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - forwarding_runtime_data:/var/lib/all-mail-secrets:ro
      - database_runtime_data:/var/lib/all-mail-database:ro
    networks:
      - provider-network
      - database-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "worker", "forwarding"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker-retention:
    <<: *go-runtime
    command: ["worker", "retention"]
    environment:
      ALL_MAIL_STATE_DIR: /tmp/all-mail
      DATABASE_URL_FILE: /var/lib/all-mail-database/retention-url
      API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
      API_LOG_CLEANUP_INTERVAL_MINUTES: ${API_LOG_CLEANUP_INTERVAL_MINUTES:-60}
      API_LOG_CLEANUP_RETRY_SECONDS: ${API_LOG_CLEANUP_RETRY_SECONDS:-30}
      API_LOG_CLEANUP_TIMEOUT_SECONDS: ${API_LOG_CLEANUP_TIMEOUT_SECONDS:-60}
      API_LOG_CLEANUP_BATCH_SIZE: ${API_LOG_CLEANUP_BATCH_SIZE:-5000}
      API_LOG_CLEANUP_MAX_BATCHES: ${API_LOG_CLEANUP_MAX_BATCHES:-10}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-90}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - database_runtime_data:/var/lib/all-mail-database:ro
    networks:
      - database-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "worker", "retention"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        password="$$(cat /run/all-mail-secrets/redis-password)"
        mkdir -p /tmp/all-mail-redis
        cat > /tmp/all-mail-redis/redis.conf <<CONFIG
        appendonly yes
        port 6379
        dir /data
        requirepass $${password}
        CONFIG
        chown -R redis:redis /data /tmp/all-mail-redis
        chmod 0600 /tmp/all-mail-redis/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/all-mail-redis/redis.conf
    restart: unless-stopped
    networks:
      - cache-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/all-mail-secrets/redis-password)\" redis-cli -p 6379 ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
      - redis_runtime_data:/run/all-mail-secrets:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-allmail}
    restart: unless-stopped
    networks:
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allmail} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-p", "5432"]

networks:
  public-network:
    driver: bridge
  app-network:
    driver: bridge
    internal: true
  provider-network:
    driver: bridge
  database-network:
    driver: bridge
    internal: true
  cache-network:
    driver: bridge
    internal: true

volumes:
  runtime_secrets_data:
    name: "${COMPOSE_PROJECT_NAME:-all-mail}_legacy_runtime_data"
  bootstrap_admin_data:
  forwarding_runtime_data:
  go_business_runtime_data:
  redis_runtime_data:
  database_runtime_data:
  redis_data:
  postgres_data:
