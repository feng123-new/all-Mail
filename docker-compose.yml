name: ${COMPOSE_PROJECT_NAME:-all-mail}

x-bootstrap-environment: &bootstrap-environment
  NODE_ENV: production
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  ALL_MAIL_STATE_DIR: /var/lib/all-mail
  ALL_MAIL_PRINT_BOOTSTRAP_PASSWORD: ${ALL_MAIL_PRINT_BOOTSTRAP_PASSWORD:-false}
  DATABASE_URL: "postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-allmail}"
  JWT_SECRET: ${JWT_SECRET:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_SECRET_FILE: /var/lib/all-mail/bootstrap-admin.env

x-api-environment: &api-environment
  NODE_ENV: production
  ALL_MAIL_STATE_DIR: /var/lib/all-mail
  BOOTSTRAP_ADMIN_SECRET_FILE: /var/lib/all-mail/bootstrap-admin.env
  DATABASE_URL: "postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-allmail}"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
  ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-15}
  ADMIN_2FA_WINDOW: ${ADMIN_2FA_WINDOW:-1}
  SEND_ENABLED_DOMAINS: ${SEND_ENABLED_DOMAINS:-}
  INGRESS_SIGNING_SECRET: ${INGRESS_SIGNING_SECRET:-}
  INGRESS_ALLOWED_SKEW_SECONDS: ${INGRESS_ALLOWED_SKEW_SECONDS:-300}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-}
  MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
  MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
  MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
  MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
  MICROSOFT_OAUTH_SCOPES: ${MICROSOFT_OAUTH_SCOPES:-}

x-allmail-hardening: &allmail-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-legacy-runtime: &legacy-runtime
  <<: *allmail-hardening
  user: "10001:10001"

x-go-runtime: &go-runtime
  <<: *allmail-hardening
  image: ${ALL_MAIL_GO_IMAGE:-all-mail-go}:${ALL_MAIL_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

x-legacy-long-runtime: &legacy-long-runtime
  <<: *legacy-runtime
  image: ${ALL_MAIL_LEGACY_IMAGE:-all-mail-legacy}:${ALL_MAIL_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.legacy

x-legacy-init-runtime: &legacy-init-runtime
  image: ${ALL_MAIL_LEGACY_IMAGE:-all-mail-legacy}:${ALL_MAIL_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.legacy
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  legacy-init:
    <<: *legacy-init-runtime
    command: ["init"]
    environment:
      <<: *bootstrap-environment
      ALL_MAIL_EXPORT_ENCRYPTION_KEY_FILE: /var/lib/all-mail-forwarding/encryption-key
      ALL_MAIL_ALLOW_LEGACY_DB_PUSH_REPAIR: ${ALL_MAIL_ALLOW_LEGACY_DB_PUSH_REPAIR:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - legacy_runtime_data:/var/lib/all-mail
      - forwarding_runtime_data:/var/lib/all-mail-forwarding
    networks:
      - app-network

  go-migrate:
    <<: *go-runtime
    command: ["migrate"]
    environment:
      ALL_MAIL_MIGRATION_DIR: /app/migrations
      DATABASE_URL: "postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-allmail}"
    depends_on:
      legacy-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  legacy-api:
    <<: *legacy-long-runtime
    command: ["api"]
    environment:
      <<: *api-environment
      PORT: 3100
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - legacy_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/app/scripts/sanitize-runtime-env.sh", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3100) + '/readyz').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  app:
    <<: *go-runtime
    command: ["api"]
    ports:
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PORT:-3002}:3000"
    environment:
      PORT: 3000
      ALL_MAIL_STATIC_DIR: /app/public
      LEGACY_API_URL: http://legacy-api:3100
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      legacy-api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker-forwarding:
    <<: *go-runtime
    command: ["worker", "forwarding"]
    environment:
      ALL_MAIL_STATE_DIR: /tmp/all-mail
      ENCRYPTION_KEY_FILE: /var/lib/all-mail-secrets/encryption-key
      DATABASE_URL: "postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-allmail}"
      FORWARDING_WORKER_INTERVAL_SECONDS: ${FORWARDING_WORKER_INTERVAL_SECONDS:-30}
      FORWARDING_WORKER_BATCH_SIZE: ${FORWARDING_WORKER_BATCH_SIZE:-10}
      FORWARDING_RUN_TIMEOUT_SECONDS: ${FORWARDING_RUN_TIMEOUT_SECONDS:-120}
      FORWARDING_LEASE_SECONDS: ${FORWARDING_LEASE_SECONDS:-180}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-90}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - forwarding_runtime_data:/var/lib/all-mail-secrets:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "worker", "forwarding"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker-retention:
    <<: *go-runtime
    command: ["worker", "retention"]
    environment:
      ALL_MAIL_STATE_DIR: /tmp/all-mail
      DATABASE_URL: "postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-allmail}"
      API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
      API_LOG_CLEANUP_INTERVAL_MINUTES: ${API_LOG_CLEANUP_INTERVAL_MINUTES:-60}
      API_LOG_CLEANUP_RETRY_SECONDS: ${API_LOG_CLEANUP_RETRY_SECONDS:-30}
      API_LOG_CLEANUP_TIMEOUT_SECONDS: ${API_LOG_CLEANUP_TIMEOUT_SECONDS:-60}
      API_LOG_CLEANUP_BATCH_SIZE: ${API_LOG_CLEANUP_BATCH_SIZE:-5000}
      API_LOG_CLEANUP_MAX_BATCHES: ${API_LOG_CLEANUP_MAX_BATCHES:-10}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-90}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      go-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "worker", "retention"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-allmail}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allmail} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-p", "5432"]

networks:
  app-network:
    driver: bridge

volumes:
  legacy_runtime_data:
  forwarding_runtime_data:
  redis_data:
  postgres_data:
