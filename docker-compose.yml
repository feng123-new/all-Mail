name: ${COMPOSE_PROJECT_NAME:-all-mail}

x-legacy-environment: &legacy-environment
  NODE_ENV: production
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  ALL_MAIL_STATE_DIR: /var/lib/all-mail
  ALL_MAIL_PRINT_BOOTSTRAP_PASSWORD: ${ALL_MAIL_PRINT_BOOTSTRAP_PASSWORD:-false}
  DATABASE_URL: postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:-allmail_dev_password}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-allmail}
  REDIS_URL: redis://redis:${REDIS_INTERNAL_PORT:-6379}
  ALLOW_LOCAL_RATE_LIMIT_FALLBACK: ${ALLOW_LOCAL_RATE_LIMIT_FALLBACK:-false}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
  ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-15}
  ADMIN_2FA_SECRET: ${ADMIN_2FA_SECRET:-}
  ADMIN_2FA_WINDOW: ${ADMIN_2FA_WINDOW:-1}
  SEND_ENABLED_DOMAINS: ${SEND_ENABLED_DOMAINS:-}
  API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
  API_LOG_CLEANUP_INTERVAL_MINUTES: ${API_LOG_CLEANUP_INTERVAL_MINUTES:-60}
  FORWARDING_WORKER_INTERVAL_SECONDS: ${FORWARDING_WORKER_INTERVAL_SECONDS:-30}
  FORWARDING_WORKER_BATCH_SIZE: ${FORWARDING_WORKER_BATCH_SIZE:-10}
  DOMAIN_BOOTSTRAP_ADMIN_USERNAME: ${DOMAIN_BOOTSTRAP_ADMIN_USERNAME:-}
  DOMAIN_BOOTSTRAP_ADMIN_PASSWORD: ${DOMAIN_BOOTSTRAP_ADMIN_PASSWORD:-}
  INGRESS_SIGNING_SECRET: ${INGRESS_SIGNING_SECRET:-}
  INGRESS_ALLOWED_SKEW_SECONDS: ${INGRESS_ALLOWED_SKEW_SECONDS:-300}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-}
  MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
  MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
  MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
  MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
  MICROSOFT_OAUTH_SCOPES: ${MICROSOFT_OAUTH_SCOPES:-}

x-allmail-hardening: &allmail-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    ports:
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PORT:-3002}:${APP_INTERNAL_PORT:-3000}"
    environment:
      ALL_MAIL_ENV: production
      GO_API_MODE: ${GO_API_MODE:-bridge}
      PORT: ${APP_INTERNAL_PORT:-3000}
      ALL_MAIL_STATIC_DIR: /app/public
      ALL_MAIL_MIGRATION_DIR: /app/migrations
      LEGACY_API_URL: http://legacy-api:${LEGACY_API_INTERNAL_PORT:-3100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:-allmail_dev_password}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-allmail}
      REDIS_URL: redis://redis:${REDIS_INTERNAL_PORT:-6379}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
    depends_on:
      legacy-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    <<: *allmail-hardening

  go-jobs:
    profiles: ["go-migration"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["jobs"]
    environment:
      ALL_MAIL_ENV: production
      ALL_MAIL_STATE_DIR: /var/lib/all-mail
      GO_JOBS_HEARTBEAT_SECONDS: ${GO_JOBS_HEARTBEAT_SECONDS:-15}
      GO_JOBS_HEARTBEAT_MAX_AGE_SECONDS: ${GO_JOBS_HEARTBEAT_MAX_AGE_SECONDS:-90}
    restart: unless-stopped
    volumes:
      - go_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "jobs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    <<: *allmail-hardening

  legacy-api:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    command: ["api"]
    environment:
      <<: *legacy-environment
      PORT: ${LEGACY_API_INTERNAL_PORT:-3100}
      ALL_MAIL_RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - legacy_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/app/scripts/sanitize-runtime-env.sh", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3100) + '/readyz').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 75s

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.legacy
    command: ["jobs"]
    environment:
      <<: *legacy-environment
      PORT: ${LEGACY_API_INTERNAL_PORT:-3100}
      ALL_MAIL_RUN_MIGRATIONS: "0"
    depends_on:
      legacy-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - legacy_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/app/scripts/sanitize-runtime-env.sh", "node", "-e", "const fs=require('node:fs'); const file=(process.env.ALL_MAIL_STATE_DIR||'/var/lib/all-mail') + '/jobs-heartbeat.txt'; const maxAgeMs=((((Number(process.env.FORWARDING_WORKER_INTERVAL_SECONDS)||30)*3)+30)*1000); try { const ageMs=Date.now()-fs.statSync(file).mtimeMs; process.exit(ageMs <= maxAgeMs ? 0 : 1); } catch { process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_HOST:-127.0.0.1}:${REDIS_PORT:-6380}:${REDIS_INTERNAL_PORT:-6379}"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_INTERNAL_PORT:-6379} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --port ${REDIS_INTERNAL_PORT:-6379}"]

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-15433}:${POSTGRES_INTERNAL_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allmail_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-allmail}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allmail} -p ${POSTGRES_INTERNAL_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-p", "${POSTGRES_INTERNAL_PORT:-5432}"]

networks:
  app-network:
    driver: bridge

volumes:
  legacy_runtime_data:
  go_runtime_data:
  redis_data:
  postgres_data:
