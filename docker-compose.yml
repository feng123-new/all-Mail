name: ${COMPOSE_PROJECT_NAME:-all-mail}

x-allmail-environment: &allmail-environment
  ALL_MAIL_ENV: production
  PORT: ${APP_INTERNAL_PORT:-3000}
  APP_PORT: ${APP_PORT:-3002}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  ALL_MAIL_STATIC_DIR: /app/public
  ALL_MAIL_STATE_DIR: /var/lib/all-mail
  DATABASE_URL: postgresql://${POSTGRES_USER:-allmail}:${POSTGRES_PASSWORD:-allmail_dev_password}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-allmail}
  REDIS_URL: redis://redis:${REDIS_INTERNAL_PORT:-6379}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
  ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-15}
  ADMIN_2FA_SECRET: ${ADMIN_2FA_SECRET:-}
  ADMIN_2FA_WINDOW: ${ADMIN_2FA_WINDOW:-1}
  SEND_ENABLED_DOMAINS: ${SEND_ENABLED_DOMAINS:-}
  API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
  FORWARDING_WORKER_INTERVAL_SECONDS: ${FORWARDING_WORKER_INTERVAL_SECONDS:-30}
  FORWARDING_WORKER_BATCH_SIZE: ${FORWARDING_WORKER_BATCH_SIZE:-10}
  MAIL_SYNC_INTERVAL_SECONDS: ${MAIL_SYNC_INTERVAL_SECONDS:-300}
  MAIL_SYNC_FOLDERS: ${MAIL_SYNC_FOLDERS:-INBOX,Junk,SENT}
  PROVIDER_HTTP_TIMEOUT_SECONDS: ${PROVIDER_HTTP_TIMEOUT_SECONDS:-30}
  PROVIDER_CONCURRENCY: ${PROVIDER_CONCURRENCY:-8}
  MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-30}
  DOMAIN_BOOTSTRAP_ADMIN_USERNAME: ${DOMAIN_BOOTSTRAP_ADMIN_USERNAME:-}
  DOMAIN_BOOTSTRAP_ADMIN_PASSWORD: ${DOMAIN_BOOTSTRAP_ADMIN_PASSWORD:-}
  INGRESS_SIGNING_SECRET: ${INGRESS_SIGNING_SECRET:-}
  INGRESS_ALLOWED_SKEW_SECONDS: ${INGRESS_ALLOWED_SKEW_SECONDS:-300}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-}
  MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
  MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
  MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
  MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-}
  MICROSOFT_OAUTH_SCOPES: ${MICROSOFT_OAUTH_SCOPES:-}

x-allmail-hardening: &allmail-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    ports:
      - "${APP_PUBLISH_HOST:-127.0.0.1}:${APP_PORT:-3002}:${APP_INTERNAL_PORT:-3000}"
    environment: *allmail-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    <<: *allmail-hardening

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["jobs"]
    environment: *allmail-environment
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_runtime_data:/var/lib/all-mail
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "allmail", "doctor", "jobs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    <<: *allmail-hardening

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_HOST:-127.0.0.1}:${REDIS_PORT:-6380}:${REDIS_INTERNAL_PORT:-6379}"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_INTERNAL_PORT:-6379} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --port ${REDIS_INTERNAL_PORT:-6379}"]

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PUBLISH_HOST:-127.0.0.1}:${POSTGRES_PORT:-15433}:${POSTGRES_INTERNAL_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allmail_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-allmail}
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allmail} -p ${POSTGRES_INTERNAL_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-p", "${POSTGRES_INTERNAL_PORT:-5432}"]

networks:
  app-network:
    driver: bridge

volumes:
  app_runtime_data:
  redis_data:
  postgres_data:
