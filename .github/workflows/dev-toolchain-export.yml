name: Development toolchain export

on:
  push:
    branches:
      - agent/final-go-cutover
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: core/go.sum
      - name: Download Go modules
        working-directory: core
        run: go mod download
      - name: Package toolchain and module cache
        shell: bash
        run: |
          set -euo pipefail
          goroot="$(go env GOROOT)"
          gomodcache="$(go env GOMODCACHE)"
          mkdir -p export
          tar -C "$(dirname "$goroot")" -czf export/go-toolchain.tar.gz "$(basename "$goroot")"
          tar -C "$(dirname "$gomodcache")" -czf export/go-mod-cache.tar.gz "$(basename "$gomodcache")"
          go version > export/go-version.txt
          go env GOROOT GOMODCACHE >> export/go-version.txt
      - name: Upload development toolchain
        uses: actions/upload-artifact@v4
        with:
          name: all-mail-go-toolchain
          path: export
          if-no-files-found: error
          retention-days: 1
