name: Cleanup completed maintenance branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Delete completed branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            chore/oss-license-agpl \
            chore/readme-oss-project-home \
            fix/oss-license-contracts-go1266
          do
            encoded=${branch//\//%2F}
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || {
              echo "failed to delete $branch" >&2
              exit 1
            }
          done

      - name: Remove one-off cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-completed-branches.yml
          git commit -m "chore: remove completed-branch cleanup workflow"
          git push origin HEAD:main
