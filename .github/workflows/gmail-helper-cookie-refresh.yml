name: Migrate Gmail helper to cookie sessions

on:
  push:
    branches: [agent/full-stack-consistency-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: agent/full-stack-consistency-audit
          fetch-depth: 0

      - name: Rewrite helper admin integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gmail_oauth/gmail_oauth_auto.py')
          source = path.read_text()

          source = source.replace('import argparse\n', 'import argparse\nimport getpass\n', 1)
          source = source.replace(
              'from urllib.request import Request, urlopen\n',
              'from urllib.request import Request, urlopen\n\nfrom admin_client import AdminAPIError, AdminSession\n',
              1,
          )
          source = source.replace(
              'DEFAULT_SCOPES = "openid email profile https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.modify https://mail.google.com/"',
              'DEFAULT_SCOPES = "openid email profile https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send"',
              1,
          )

          request_start = source.index('\ndef request_json(\n')
          request_end = source.index('\ndef build_code_verifier()', request_start)
          source = source[:request_start] + source[request_end:]

          integration_start = source.index('\ndef find_existing_email(')
          integration_end = source.index('\n\nclass CallbackCapture:', integration_start)
          replacement = r'''

def find_existing_email(session: AdminSession, email: str) -> dict | None:
    query = urlencode({"page": 1, "pageSize": 20, "keyword": email})
    response = session.request_json(f"/admin/emails?{query}")
    items = response.get("data", {}).get("list", [])
    target = email.strip().lower()
    for item in items:
        if str(item.get("email", "")).strip().lower() == target:
            return item
    return None


def create_email_account(
    session: AdminSession, payload: dict[str, str | None]
) -> dict:
    return session.request_json(
        "/admin/emails",
        method="POST",
        data={
            "email": payload["email"],
            "provider": "GMAIL",
            "authType": "GOOGLE_OAUTH",
            "clientId": payload["clientId"],
            "clientSecret": payload["clientSecret"],
            "refreshToken": payload["refreshToken"],
        },
    )["data"]


def update_email_account(
    session: AdminSession,
    email_id: int,
    payload: dict[str, str | None],
) -> dict:
    return session.request_json(
        f"/admin/emails/{email_id}",
        method="PUT",
        data={
            "email": payload["email"],
            "provider": "GMAIL",
            "authType": "GOOGLE_OAUTH",
            "clientId": payload["clientId"],
            "clientSecret": payload["clientSecret"],
            "refreshToken": payload["refreshToken"],
            "password": None,
            "status": "ACTIVE",
        },
    )["data"]


def login_admin_session(
    session: AdminSession,
    username: str,
    password: str,
) -> dict:
    try:
        admin = session.login(username, password)
    except AdminAPIError as error:
        if error.code != "OTP_REQUIRED":
            raise
        otp = getpass.getpass("Administrator OTP (6 digits): ").strip()
        if len(otp) != 6 or not otp.isdigit():
            raise SystemExit("Administrator OTP must contain exactly 6 digits")
        admin = session.login(username, password, otp=otp)

    if bool(admin.get("mustChangePassword")):
        raise SystemExit(
            "The administrator must change the temporary password in the browser before the Gmail helper can update mailboxes"
        )
    return admin


def maybe_auto_update_mailbox(
    config: dict[str, str],
    payload: dict[str, str | None],
    mailbox: str,
    skip_update: bool,
    skip_fetch_check: bool,
) -> dict | None:
    if skip_update:
        return None

    target_email_id = config.get("TARGET_EMAIL_ID", "").strip()
    admin_base_url = config.get("ADMIN_BASE_URL", "").strip()
    admin_username = config.get("ADMIN_USERNAME", "").strip()
    admin_password = config.get("ADMIN_PASSWORD", "").strip()
    allow_target_replace = is_truthy(config.get("ALLOW_TARGET_ID_REPLACE", ""))

    if not (admin_base_url and admin_username and admin_password):
        return None

    session = AdminSession(admin_base_url)
    try:
        admin = login_admin_session(session, admin_username, admin_password)
        existing_exact = find_existing_email(session, str(payload["email"]))

        action = "updated_exact_email"
        if existing_exact:
            email_id = int(existing_exact["id"])
            update_response = update_email_account(session, email_id, payload)
        elif not target_email_id:
            action = "created_new_email"
            update_response = create_email_account(session, payload)
            email_id = int(update_response["id"])
        else:
            email_id = int(target_email_id)
            target_detail = session.request_json(
                f"/admin/emails/{email_id}"
            )["data"]
            target_email = str(target_detail.get("email", "")).strip().lower()
            payload_email = str(payload["email"]).strip().lower()

            if target_email == payload_email:
                action = "updated_target_id"
                update_response = update_email_account(session, email_id, payload)
            elif allow_target_replace:
                action = "replaced_target_id"
                update_response = update_email_account(session, email_id, payload)
            else:
                action = "created_new_email"
                update_response = create_email_account(session, payload)
                email_id = int(update_response["id"])

        summary: dict[str, object] = {
            "updated": True,
            "action": action,
            "emailId": email_id,
            "email": update_response["email"],
            "status": update_response["status"],
            "updatedAt": update_response.get("updatedAt"),
            "administrator": {
                "id": admin.get("id"),
                "username": admin.get("username"),
                "role": admin.get("role"),
                "twoFactorEnabled": bool(admin.get("twoFactorEnabled")),
            },
        }

        detail = session.request_json(f"/admin/emails/{email_id}")["data"]
        summary["verify"] = {
            "email": detail["email"],
            "provider": detail["provider"],
            "authType": detail["authType"],
            "clientId": detail.get("clientId"),
            "status": detail["status"],
            "credentialWriteRequested": {
                "clientSecret": bool(payload.get("clientSecret")),
                "refreshToken": bool(payload.get("refreshToken")),
            },
        }

        if not skip_fetch_check:
            fetch_response = session.request_json(
                f"/admin/emails/{email_id}/mails?mailbox={mailbox}"
            )
            summary["fetch"] = {
                "mailbox": mailbox,
                "method": fetch_response["data"].get("method"),
                "count": fetch_response["data"].get("count"),
                "firstSubject": (
                    (fetch_response["data"].get("messages") or [{}])[0].get("subject")
                    if fetch_response["data"].get("messages")
                    else None
                ),
            }

        return summary
    except AdminAPIError as error:
        raise SystemExit(error.describe()) from error
'''
          source = source[:integration_start] + replacement + source[integration_end:]

          forbidden = [
              'login["data"]["token"]',
              'headers={"Authorization": f"Bearer {token}"}',
              '?secrets=true',
              'https://mail.google.com/',
          ]
          for value in forbidden:
              if value in source:
                  raise SystemExit(f'legacy Gmail helper contract remains: {value}')
          if 'AdminSession(admin_base_url)' not in source or 'OTP_REQUIRED' not in source:
              raise SystemExit('cookie/OTP migration was incomplete')

          path.write_text(source)
          PY
          python3 -m py_compile gmail_oauth/gmail_oauth_auto.py gmail_oauth/admin_client.py
          git diff --check

      - name: Commit helper migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gmail_oauth/gmail_oauth_auto.py; then
            echo 'Gmail helper is already cookie-first'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gmail_oauth/gmail_oauth_auto.py
          git commit -m 'fix(helper): migrate Gmail automation to cookie sessions'
          git push origin HEAD:agent/full-stack-consistency-audit
