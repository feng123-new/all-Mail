name: Configuration and proxy security

on:
  pull_request:
    branches: [main, master, agent/config-security-hard-delete]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify runtime and environment contracts
        run: ./scripts/sanitize-runtime-env.sh node --test scripts/*.test.mjs

  go-gateway-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Verify canonical config and proxy identity
        run: go test -race ./internal/config ./internal/readiness ./internal/httpapi
      - name: Reject removed aliases in production Go sources
        shell: bash
        run: |
          if grep -R -nE \
            --include='*.go' \
            --exclude='*_test.go' \
            'GO_JOBS_HEARTBEAT_SECONDS|GO_JOBS_HEARTBEAT_MAX_AGE_SECONDS|ALL_MAIL_SECRET_STATE_DIR|ALL_MAIL_PUBLIC_BASE_URL|GO_API_MODE' \
            ./cmd ./internal; then
            echo 'removed Go configuration alias remains in production code'
            exit 1
          fi

  compose-boundary:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Prepare production environment
        run: cp .env.example .env
      - name: Validate production and development Compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Inspect ownership and exposure model
        shell: bash
        run: |
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python3 - "$RUNNER_TEMP/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              model = json.load(handle)
          services = model['services']

          app_env = services['app'].get('environment', {})
          for forbidden in ('DATABASE_URL', 'REDIS_URL', 'GO_API_MODE', 'ALL_MAIL_ENV'):
              assert forbidden not in app_env, f'app still receives {forbidden}'

          forwarding_env = services['worker-forwarding'].get('environment', {})
          assert forwarding_env.get('ENCRYPTION_KEY_FILE') == '/var/lib/all-mail-secrets/encryption-key'
          assert 'ENCRYPTION_KEY' not in forwarding_env

          assert services['worker-retention'].get('volumes') in (None, []), 'retention heartbeat must stay ephemeral'

          init_deps = services['legacy-init'].get('depends_on', {})
          assert 'redis' not in init_deps, 'legacy-init still waits for Redis'

          for name in ('postgres', 'redis'):
              assert not services[name].get('ports'), f'{name} is published by production Compose'

          assert services['app'].get('ports'), 'public Go app has no published port'
          PY

  # BEGIN AGENT_RUNTIME_NAME_PUBLISHER
  runtime-name-publisher:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/retire-migration-era-names'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/retire-migration-era-names
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Execute staged runtime naming publisher
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Dockerfile.server ]; then
            echo 'Runtime naming transformation is already published.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-runtime-name-publisher.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          workflow_block = script.index("config_security_path = Path('.github/workflows/config-security.yml')")
          python_end = script.index('\nPY\n', workflow_block)
          script = script[:workflow_block] + script[python_end + 1:]
          script = script.replace(
              'git add -A\n',
              "git add -A -- . ':(exclude).github/workflows/**'\n",
          )
          Path('/tmp/all-mail-runtime-name-publisher.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/all-mail-runtime-name-publisher.sh
  # END AGENT_RUNTIME_NAME_PUBLISHER
