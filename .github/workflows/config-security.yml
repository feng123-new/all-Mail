name: Configuration and proxy security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify runtime and environment contracts
        run: ./scripts/sanitize-runtime-env.sh node --test scripts/*.test.mjs

  go-gateway-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Verify canonical config and proxy identity
        run: go test -race ./internal/config ./internal/readiness ./internal/httpapi
      - name: Reject removed aliases in production Go sources
        shell: bash
        run: |
          if grep -R -nE \
            --include='*.go' \
            --exclude='*_test.go' \
            --exclude='preflight.go' \
            'GO_JOBS_HEARTBEAT_SECONDS|GO_JOBS_HEARTBEAT_MAX_AGE_SECONDS|ALL_MAIL_SECRET_STATE_DIR|ALL_MAIL_PUBLIC_BASE_URL|GO_API_MODE' \
            ./cmd ./internal; then
            echo 'removed Go configuration alias remains in production code'
            exit 1
          fi

  compose-boundary:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Prepare production environment
        run: cp .env.example .env
      - name: Validate production and development Compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.init.yml config --quiet
      - name: Inspect ownership and exposure model
        shell: bash
        run: |
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python3 - "$RUNNER_TEMP/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              model = json.load(handle)
          services = model['services']
          assert set(services) == {
              'app', 'go-business-api', 'worker-forwarding',
              'worker-retention', 'postgres', 'redis',
          }, f'unexpected production services: {sorted(services)}'

          def network_names(service):
              networks = services[service].get('networks', {})
              return set(networks if isinstance(networks, dict) else networks)

          expected_networks = {
              'app': {'public-network', 'app-network'},
              'go-business-api': {'app-network', 'provider-network', 'database-network', 'cache-network'},
              'worker-forwarding': {'provider-network', 'database-network'},
              'worker-retention': {'database-network'},
              'postgres': {'database-network'},
              'redis': {'cache-network'},
          }
          for service, expected in expected_networks.items():
              assert network_names(service) == expected, (service, network_names(service), expected)

          for name in ('app-network', 'database-network', 'cache-network'):
              assert model['networks'][name].get('internal') is True, f'{name} is not internal'

          app_env = services['app'].get('environment', {})
          for forbidden in (
              'DATABASE_URL', 'DATABASE_URL_FILE', 'REDIS_URL', 'REDIS_PASSWORD_FILE',
              'JWT_SECRET_FILE', 'ENCRYPTION_KEY_FILE', 'BUSINESS_API_URL',
              'GO_API_MODE', 'ALL_MAIL_ENV',
          ):
              assert forbidden not in app_env, f'app still receives {forbidden}'

          forwarding_env = services['worker-forwarding'].get('environment', {})
          assert forwarding_env.get('ENCRYPTION_KEY_FILE') == '/var/lib/all-mail-secrets/encryption-key'
          assert forwarding_env.get('DATABASE_URL_FILE') == '/var/lib/all-mail-database/forwarding-url'
          assert 'DATABASE_URL' not in forwarding_env
          assert 'ENCRYPTION_KEY' not in forwarding_env

          go_business_env = services['go-business-api'].get('environment', {})
          assert go_business_env.get('ALL_MAIL_RUNTIME_ENV') == 'production'
          assert 'NODE_ENV' not in go_business_env
          assert go_business_env.get('DATABASE_URL_FILE') == '/var/lib/all-mail-database/api-url'
          assert 'DATABASE_URL' not in go_business_env
          assert go_business_env.get('ENCRYPTION_KEY_FILE') == '/var/lib/all-mail-encryption/encryption-key'
          assert go_business_env.get('JWT_SECRET_FILE') == '/var/lib/all-mail-secrets/jwt-secret'
          assert go_business_env.get('REDIS_PASSWORD_FILE') == '/var/lib/all-mail-redis/redis-password'
          assert go_business_env.get('JWT_EXPIRES_IN') == '2h'
          assert go_business_env.get('ADMIN_LOGIN_MAX_ATTEMPTS') == '5'
          assert go_business_env.get('ADMIN_LOGIN_LOCK_MINUTES') == '15'
          assert go_business_env.get('BOOTSTRAP_ADMIN_SECRET_FILE') == '/var/lib/all-mail/bootstrap-admin.env'
          assert go_business_env.get('INGRESS_ALLOWED_SKEW_SECONDS') == '300'
          assert 'ENCRYPTION_KEY' not in go_business_env

          go_business_mounts = services['go-business-api'].get('volumes', [])
          mounts = {mount.get('target'): mount for mount in go_business_mounts}
          assert mounts['/var/lib/all-mail'].get('read_only', False) is False, 'Go auth cannot remove the consumed bootstrap credential'
          for target in (
              '/var/lib/all-mail-secrets',
              '/var/lib/all-mail-encryption',
              '/var/lib/all-mail-redis',
              '/var/lib/all-mail-database',
          ):
              assert target in mounts and mounts[target].get('read_only') is True, f'{target} is not read-only'
          assert not any(
              mount.get('source', '').endswith('_legacy_runtime_data')
              for mount in go_business_mounts
          ), 'private API still mounts initializer-only master state'

          retention_env = services['worker-retention'].get('environment', {})
          assert retention_env.get('DATABASE_URL_FILE') == '/var/lib/all-mail-database/retention-url'
          assert 'DATABASE_URL' not in retention_env
          retention_mounts = services['worker-retention'].get('volumes', [])
          assert len(retention_mounts) == 1
          assert retention_mounts[0].get('target') == '/var/lib/all-mail-database'
          assert retention_mounts[0].get('read_only') is True

          for name in ('postgres', 'redis'):
              assert not services[name].get('ports'), f'{name} is published by production Compose'

          assert services['app'].get('ports'), 'public Go app has no published port'
          assert 'runtime_secrets_data' not in model.get('volumes', {}), 'initializer-only volume leaked into service graph'
          PY

          grep -Fq '${COMPOSE_PROJECT_NAME:-all-mail}_legacy_runtime_data' docker-compose.yml
          grep -Fq 'project_name}_legacy_runtime_data' scripts/compose-up.sh
