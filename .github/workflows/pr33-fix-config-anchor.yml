name: PR33 fix config security patch anchor

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr33-fix-config-anchor
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-ingress-lifecycle
          fetch-depth: 0
      - name: Replace brittle config-security block with a stable insertion anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/pr33_runtime_patch.py')
          content = path.read_text(encoding='utf-8')
          start_marker = "replace_once(\n    '.github/workflows/config-security.yml',"
          next_marker = "replace_once(\n    'docs/GO-MIGRATION.md',"
          start = content.find(start_marker)
          end = content.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('brittle config-security patch block was not found')
          replacement = '''insert_after(
              '.github/workflows/config-security.yml',
              "          assert 'ENCRYPTION_KEY' not in forwarding_env\\n",
              """

                    go_business_env = services['go-business-api'].get('environment', {})
                    assert go_business_env.get('ENCRYPTION_KEY_FILE') == '/var/lib/all-mail-encryption/encryption-key'
                    assert go_business_env.get('INGRESS_ALLOWED_SKEW_SECONDS') == '300'
                    assert 'ENCRYPTION_KEY' not in go_business_env
          """,
          )

          '''
          path.write_text(content[:start] + replacement + content[end:], encoding='utf-8')
          PY
          python3 -m py_compile scripts/pr33_runtime_patch.py
          git diff --check
      - name: Commit the corrected patch and remove this helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pr33_runtime_patch.py
          git rm .github/workflows/pr33-fix-config-anchor.yml
          git commit -m "fix(ci): stabilize PR33 config security patch"
          git push origin HEAD:agent/go-ingress-lifecycle
