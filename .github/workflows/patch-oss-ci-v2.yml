name: Patch OSS CI v2

on:
  push:
    branches:
      - "fix/oss-license-contracts-go1266"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/oss-license-contracts-go1266

      - name: Apply repository patch
        run: python3 scripts/patch-oss-ci.py

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Verify updated contracts
        run: |
          ./scripts/sanitize-runtime-env.sh node --test scripts/release-contract.test.mjs scripts/runtime-documentation.test.mjs
          git diff --check

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Verify Go security baseline
        working-directory: core
        run: |
          go version
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Commit final patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-oss-ci.yml .github/workflows/patch-oss-ci-v2.yml scripts/patch-oss-ci.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align OSS contracts and Go security baseline"
          git push origin HEAD:fix/oss-license-contracts-go1266
