name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test runtime scripts
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh node --test scripts/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload runtime test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-log
          path: ${{ runner.temp }}/runtime-tests.log
          if-no-files-found: error

  go:
    name: go-core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allmail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allmail_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Setup Node.js for Prisma integration
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client for test scaffolding
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Check formatting
        shell: bash
        run: |
          set +e
          gofmt -l . | tee "$RUNNER_TEMP/gofmt-files.txt"
          gofmt -d . > "$RUNNER_TEMP/gofmt.patch"
          test ! -s "$RUNNER_TEMP/gofmt-files.txt"

      - name: Upload Go formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-diagnostics
          path: |
            ${{ runner.temp }}/gofmt-files.txt
            ${{ runner.temp }}/gofmt.patch
          if-no-files-found: warn

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./allmail ./cmd/allmail

      - name: Verify fresh and repeated Go migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_ci?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE admins (id integer PRIMARY KEY);
          CREATE TABLE email_accounts (id integer PRIMARY KEY);
          CREATE TABLE outbound_messages (id bigint PRIMARY KEY);
          CREATE TABLE api_logs (
              id bigserial PRIMARY KEY,
              created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TYPE "ForwardJobStatus" AS ENUM ('PENDING', 'RUNNING', 'SENT', 'FAILED', 'SKIPPED');
          CREATE TABLE mailbox_forward_jobs (
              id bigserial PRIMARY KEY,
              status "ForwardJobStatus" NOT NULL DEFAULT 'PENDING',
              next_attempt_at timestamptz,
              created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
          ./allmail migrate
          ./allmail migrate
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations')" = "3"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations WHERE checksum IS NULL OR length(checksum) <> 64')" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT datetime_precision FROM information_schema.columns WHERE table_name = 'mailbox_forward_jobs' AND column_name = 'lease_expires_at'")" = "3"

      - name: Verify dedicated retention worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_ci?sslmode=disable
          ALL_MAIL_STATE_DIR: ${{ runner.temp }}/allmail-retention
          API_LOG_RETENTION_DAYS: 30
          API_LOG_CLEANUP_INTERVAL_MINUTES: 60
          API_LOG_CLEANUP_RETRY_SECONDS: 1
          API_LOG_CLEANUP_TIMEOUT_SECONDS: 10
          API_LOG_CLEANUP_BATCH_SIZE: 5000
          WORKER_HEARTBEAT_SECONDS: 1
          WORKER_HEARTBEAT_MAX_AGE_SECONDS: 10
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO api_logs (created_at)
          VALUES (now() - interval '45 days'), (now() - interval '5 days');
          SQL
          mkdir -p "$ALL_MAIL_STATE_DIR"
          ./allmail worker retention &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep -q '"lastSuccessAt"' "$ALL_MAIL_STATE_DIR/worker-retention-heartbeat.json" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          ./allmail doctor worker retention
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          trap - EXIT
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM api_logs WHERE created_at < now() - interval '30 days'")" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM api_logs WHERE created_at >= now() - interval '30 days'")" = "1"

      - name: Verify legacy ledger adoption
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_legacy_ledger?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_legacy_ledger
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE admins (id integer PRIMARY KEY);
          CREATE TABLE email_accounts (id integer PRIMARY KEY);
          CREATE TABLE outbound_messages (id bigint PRIMARY KEY);
          CREATE TABLE runtime_migrations (
              name text PRIMARY KEY,
              applied_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TYPE "ForwardJobStatus" AS ENUM ('PENDING', 'RUNNING', 'SENT', 'FAILED', 'SKIPPED');
          CREATE TABLE mailbox_forward_jobs (
              id bigserial PRIMARY KEY,
              status "ForwardJobStatus" NOT NULL DEFAULT 'PENDING',
              next_attempt_at timestamptz,
              created_at timestamptz NOT NULL DEFAULT now()
          );
          INSERT INTO runtime_migrations (name)
          VALUES ('0001_go_runtime_foundation'), ('0002_runtime_security_state');
          SQL
          ./allmail migrate
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations WHERE checksum IS NULL OR length(checksum) <> 64')" = "0"

      - name: Reject malformed pre-existing schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_corrupt?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_corrupt
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE admins (id integer PRIMARY KEY);
          CREATE TABLE email_accounts (id integer PRIMARY KEY);
          CREATE TABLE outbound_messages (id bigint PRIMARY KEY);
          CREATE TABLE runtime_login_attempts (subject_key varchar(255) PRIMARY KEY);
          SQL
          if ./allmail migrate; then
            echo "migration unexpectedly accepted malformed runtime_login_attempts"
            exit 1
          fi
          test "$(psql "$DATABASE_URL" -Atqc "SELECT to_regclass('runtime_migrations') IS NULL")" = "t"

      - name: Reject malformed forwarding lease schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_corrupt?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_forwarding_corrupt
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE admins (id integer PRIMARY KEY);
          CREATE TABLE email_accounts (id integer PRIMARY KEY);
          CREATE TABLE outbound_messages (id bigint PRIMARY KEY);
          CREATE TYPE "ForwardJobStatus" AS ENUM ('PENDING', 'RUNNING', 'SENT', 'FAILED', 'SKIPPED');
          CREATE TABLE mailbox_forward_jobs (
              id bigserial PRIMARY KEY,
              status "ForwardJobStatus" NOT NULL DEFAULT 'PENDING',
              next_attempt_at timestamptz,
              lease_expires_at text,
              created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
          if ./allmail migrate; then
            echo "migration unexpectedly accepted malformed mailbox_forward_jobs.lease_expires_at"
            exit 1
          fi
          test "$(psql "$DATABASE_URL" -Atqc "SELECT to_regclass('runtime_migrations') IS NULL")" = "t"

      - name: Install Prisma integration dependencies
        run: ../scripts/sanitize-runtime-env.sh npm --prefix ../server ci

      - name: Verify PostgreSQL forwarding state machine
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_integration?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
          ALLMAIL_FORWARDING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_integration?sslmode=disable
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_forwarding_integration
          ../scripts/sanitize-runtime-env.sh npm --prefix ../server run db:migrate
          ./allmail migrate
          go test -run TestPostgresForwardingIntegration -count=1 ./internal/jobs

  web:
    name: web-lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: ../scripts/sanitize-runtime-env.sh npm ci

      - name: Lint
        run: ../scripts/sanitize-runtime-env.sh npm run lint

      - name: Test
        run: ../scripts/sanitize-runtime-env.sh npm run test

      - name: Build
        run: ../scripts/sanitize-runtime-env.sh npm run build

  server:
    name: server-lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: ../scripts/sanitize-runtime-env.sh npm ci

      - name: Lint
        shell: bash
        run: |
          set +e
          ../scripts/sanitize-runtime-env.sh npm run lint 2>&1 | tee "$RUNNER_TEMP/server-lint.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload server lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-lint-log
          path: ${{ runner.temp }}/server-lint.log
          if-no-files-found: error

      - name: Test
        shell: bash
        run: |
          set +e
          ../scripts/sanitize-runtime-env.sh npm run test 2>&1 | tee "$RUNNER_TEMP/server-test.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload server test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-log
          path: ${{ runner.temp }}/server-test.log
          if-no-files-found: error

      - name: Build
        run: ../scripts/sanitize-runtime-env.sh npm run db:generate && ../scripts/sanitize-runtime-env.sh npm run build

  worker:
    name: worker-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/workers/allmail-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/workers/allmail-edge/package-lock.json

      - name: Install deps
        run: ../../../scripts/sanitize-runtime-env.sh npm ci

      - name: Check
        run: ../../../scripts/sanitize-runtime-env.sh npm run check

  dependency-audit:
    name: production-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh npm run audit:prod 2>&1 | tee "$RUNNER_TEMP/production-audit.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload production audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-log
          path: ${{ runner.temp }}/production-audit.log
          if-no-files-found: error

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: [runtime, go, web, server, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare default env file
        run: cp .env.example .env

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start Docker stack
        shell: bash
        run: |
          set +e
          docker compose up -d --build --wait --wait-timeout 240 2>&1 | tee "$RUNNER_TEMP/docker-start.log"
          status=${PIPESTATUS[0]}
          docker compose ps -a --no-trunc > "$RUNNER_TEMP/docker-ps.txt" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/docker-compose.log" 2>&1 || true
          exit "$status"

      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-diagnostics
          path: |
            ${{ runner.temp }}/docker-start.log
            ${{ runner.temp }}/docker-ps.txt
            ${{ runner.temp }}/docker-compose.log
          if-no-files-found: warn

      - name: Verify retired legacy runtimes
        shell: bash
        run: |
          docker compose ps -a
          test "$(docker compose exec -T legacy-api id -u)" = "10001"
          for retired in go-jobs legacy-jobs jobs; do
            if docker compose config --services | grep -qx "$retired"; then
              echo "retired service remains in Compose: $retired"
              exit 1
            fi
          done
          docker compose exec -T legacy-api sh -lc "test -r /var/lib/all-mail/bootstrap-secrets.env"
          docker compose exec -T worker-forwarding sh -lc "test -r /var/lib/all-mail/encryption-key"
          if docker compose exec -T app sh -lc 'command -v psql >/dev/null'; then
            echo "Go runtime image must not include psql"
            exit 1
          fi

      - name: Verify Go and compatibility API readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3002/health
          curl --fail --silent --show-error http://127.0.0.1:3002/readyz
          docker compose exec -T legacy-api node -e "fetch('http://127.0.0.1:' + (process.env.PORT || 3100) + '/readyz').then(async (r) => { console.log(await r.text()); process.exit(r.ok ? 0 : 1); }).catch(() => process.exit(1))"

      - name: Check independent worker doctors
        run: |
          docker compose exec -T app allmail doctor api
          docker compose exec -T worker-forwarding allmail doctor worker forwarding
          docker compose exec -T worker-retention allmail doctor worker retention

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [dependency-audit, docker-smoke]
    steps:
      - name: Require audit and Docker smoke success
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$DOCKER_RESULT" = "success"
