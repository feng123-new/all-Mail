name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Test runtime scripts
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh node --test scripts/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload runtime test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-log
          path: ${{ runner.temp }}/runtime-tests.log
          if-no-files-found: error

  go:
    name: go-core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allmail_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allmail_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Install PostgreSQL client for test scaffolding
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Check formatting
        shell: bash
        run: |
          set +e
          gofmt -l . | tee "$RUNNER_TEMP/gofmt-files.txt"
          gofmt -d . > "$RUNNER_TEMP/gofmt.patch"
          test ! -s "$RUNNER_TEMP/gofmt-files.txt"

      - name: Upload Go formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gofmt-diagnostics
          path: |
            ${{ runner.temp }}/gofmt-files.txt
            ${{ runner.temp }}/gofmt.patch
          if-no-files-found: warn

      - name: Test with race detector
        shell: bash
        run: |
          set +e
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/go-race-tests.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Go race-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-test-log
          path: ${{ runner.temp }}/go-race-tests.log
          if-no-files-found: error

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o ./allmail ./cmd/allmail

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Check Go vulnerabilities
        run: govulncheck ./...

      - name: Verify fresh and repeated Go migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_ci?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          ./allmail migrate
          ./allmail migrate
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM allmail_schema_migrations')" = "18"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM _prisma_migrations')" = "14"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations')" = "4"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations WHERE checksum IS NULL OR length(checksum) <> 64')" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT datetime_precision FROM information_schema.columns WHERE table_name = 'mailbox_forward_jobs' AND column_name = 'lease_expires_at'")" = "3"

      - name: Verify dedicated retention worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_ci?sslmode=disable
          ALL_MAIL_STATE_DIR: ${{ runner.temp }}/allmail-retention
          API_LOG_RETENTION_DAYS: 30
          API_LOG_CLEANUP_INTERVAL_MINUTES: 60
          API_LOG_CLEANUP_RETRY_SECONDS: 1
          API_LOG_CLEANUP_TIMEOUT_SECONDS: 10
          API_LOG_CLEANUP_BATCH_SIZE: 5000
          WORKER_HEARTBEAT_SECONDS: 1
          WORKER_HEARTBEAT_MAX_AGE_SECONDS: 10
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO api_logs (action, created_at)
          VALUES
              ('retention-fixture', now() - interval '45 days'),
              ('retention-fixture', now() - interval '5 days');
          SQL
          mkdir -p "$ALL_MAIL_STATE_DIR"
          ./allmail worker retention &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep -q '"lastSuccessAt"' "$ALL_MAIL_STATE_DIR/worker-retention-heartbeat.json" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          ./allmail doctor worker retention
          kill -TERM "$worker_pid"
          wait "$worker_pid"
          trap - EXIT
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM api_logs WHERE created_at < now() - interval '30 days'")" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM api_logs WHERE created_at >= now() - interval '30 days'")" = "1"

      - name: Verify legacy ledger adoption
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_legacy_ledger?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_legacy_ledger
          ./allmail migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE runtime_migrations ALTER COLUMN checksum DROP NOT NULL;
          UPDATE runtime_migrations SET checksum = NULL
          WHERE name IN ('0001_go_runtime_foundation', '0002_runtime_security_state');
          DELETE FROM runtime_migrations
          WHERE name IN ('0003_forwarding_execution_v1', '0004_backfill_mail_account_oauth_authority');
          DELETE FROM allmail_schema_migrations WHERE position >= 1000;
          SQL
          ./allmail migrate
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations')" = "4"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM runtime_migrations WHERE checksum IS NULL OR length(checksum) <> 64')" = "0"
          test "$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM allmail_schema_migrations WHERE position >= 1000')" = "4"

      - name: Reject malformed pre-existing schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_corrupt?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_corrupt
          ./allmail migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE runtime_login_attempts ALTER COLUMN subject_key TYPE varchar(254);
          SQL
          if ./allmail migrate; then
            echo "migration unexpectedly accepted malformed runtime_login_attempts"
            exit 1
          fi
          test "$(psql "$DATABASE_URL" -Atqc "SELECT character_maximum_length FROM information_schema.columns WHERE table_name = 'runtime_login_attempts' AND column_name = 'subject_key'")" = "254"

      - name: Reject malformed forwarding lease schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_corrupt?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_forwarding_corrupt
          ./allmail migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE mailbox_forward_jobs ALTER COLUMN lease_expires_at TYPE text;
          SQL
          if ./allmail migrate; then
            echo "migration unexpectedly accepted malformed mailbox_forward_jobs.lease_expires_at"
            exit 1
          fi
          test "$(psql "$DATABASE_URL" -Atqc "SELECT data_type FROM information_schema.columns WHERE table_name = 'mailbox_forward_jobs' AND column_name = 'lease_expires_at'")" = "text"

      - name: Verify Go schema initialization matrix
        env:
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
          ALLMAIL_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_schema_integration?sslmode=disable
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_schema_integration
          go test -run TestGoSchemaInitializationMatrix -count=1 ./internal/schema
          createdb -h 127.0.0.1 -U postgres allmail_schema_restore
          pg_dump "$ALLMAIL_SCHEMA_TEST_DATABASE_URL" -Fc | \
            pg_restore -d 'postgresql://postgres:postgres@127.0.0.1:5432/allmail_schema_restore?sslmode=disable' --no-owner --no-privileges
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/allmail_schema_restore?sslmode=disable' ./allmail migrate

      - name: Verify API-key and external-route state machine
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_go_business_integration?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
          ALLMAIL_GO_BUSINESS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_go_business_integration?sslmode=disable
          ALLMAIL_GO_BUSINESS_TEST_REDIS_URL: redis://127.0.0.1:6379/11
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_go_business_integration
          ./allmail migrate
          go test -run '^TestPostgres' -count=1 ./internal/businessapi

      - name: Verify PostgreSQL forwarding state machine
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_integration?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
          ALLMAIL_FORWARDING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_forwarding_integration?sslmode=disable
        run: |
          createdb -h 127.0.0.1 -U postgres allmail_forwarding_integration
          ./allmail migrate
          go test -run TestPostgresForwardingIntegration -count=1 ./internal/jobs

  web:
    name: web-lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: ../scripts/sanitize-runtime-env.sh npm ci

      - name: Lint
        run: ../scripts/sanitize-runtime-env.sh npm run lint

      - name: Test
        run: ../scripts/sanitize-runtime-env.sh npm run test

      - name: Build
        run: ../scripts/sanitize-runtime-env.sh npm run build

  worker:
    name: worker-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/workers/allmail-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cloudflare/workers/allmail-edge/package-lock.json

      - name: Install deps
        run: ../../../scripts/sanitize-runtime-env.sh npm ci

      - name: Check
        run: ../../../scripts/sanitize-runtime-env.sh npm run check

  dependency-audit:
    name: production-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh npm run audit:prod 2>&1 | tee "$RUNNER_TEMP/production-audit.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload production audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-log
          path: ${{ runner.temp }}/production-audit.log
          if-no-files-found: error

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: [runtime, go, web, worker]
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare default env file
        run: cp .env.example .env

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start Docker stack
        shell: bash
        run: |
          set +e
          ./scripts/compose-up.sh 2>&1 | tee "$RUNNER_TEMP/docker-start.log"
          status=${PIPESTATUS[0]}
          docker compose ps -a --no-trunc > "$RUNNER_TEMP/docker-ps.txt" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/docker-compose.log" 2>&1 || true
          exit "$status"

      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-diagnostics
          path: |
            ${{ runner.temp }}/docker-start.log
            ${{ runner.temp }}/docker-ps.txt
            ${{ runner.temp }}/docker-compose.log
          if-no-files-found: warn

      - name: Verify Go-only runtime topology
        shell: bash
        run: |
          docker compose ps -a
          test "$(docker compose exec -T app id -u)" = "10001"
          test "$(docker compose exec -T go-business-api id -u)" = "10001"
          for retired in business-api business-init go-migrate go-jobs legacy-jobs jobs; do
            if docker compose config --services | grep -qx "$retired"; then
              echo "retired service remains in Compose: $retired"
              exit 1
            fi
          done
          docker compose exec -T go-business-api sh -lc '
            test -r /var/lib/all-mail/runtime-secrets.env
            test ! -e /var/lib/all-mail/bootstrap-secrets.env
          '
          docker compose exec -T worker-forwarding sh -lc "test -r /var/lib/all-mail-secrets/encryption-key"
          if docker compose exec -T app sh -lc 'command -v psql >/dev/null'; then
            echo "Go runtime image must not include psql"
            exit 1
          fi

      - name: Verify Go readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3002/health
          curl --fail --silent --show-error http://127.0.0.1:3002/readyz
          docker compose exec -T go-business-api allmail doctor business-api

      - name: Verify final image contains no Node or Prisma runtime
        shell: bash
        run: |
          image=$(docker compose images -q app)
          test -n "$image"
          docker run --rm --entrypoint /bin/sh "$image" -c '
            for command in node nodejs npm npx pnpm prisma; do
              if command -v "$command" >/dev/null 2>&1; then
                echo "forbidden runtime command found: $command"
                exit 1
              fi
            done
            if find / -iname "*prisma*" -print -quit 2>/dev/null | grep -q .; then
              echo "Prisma artifact found in final image"
              exit 1
            fi
            test ! -e /app/server
          '

      - name: Generate final image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: all-mail-go:local
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/all-mail-go.cdx.json

      - name: Verify SBOM contains no Node or Prisma packages
        run: |
          python3 - "$RUNNER_TEMP/all-mail-go.cdx.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              sbom = json.load(handle)
          forbidden = []
          for component in sbom.get('components', []):
              name = str(component.get('name', '')).lower()
              purl = str(component.get('purl', '')).lower()
              if name in {'node', 'nodejs', 'npm', 'prisma', '@prisma/client'} or 'pkg:npm/@prisma/' in purl or 'pkg:npm/prisma@' in purl:
                  forbidden.append({'name': name, 'purl': purl})
          if forbidden:
              raise SystemExit(f'forbidden SBOM components: {forbidden}')
          PY

      - name: Upload final image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: all-mail-go-cyclonedx
          path: ${{ runner.temp }}/all-mail-go.cdx.json
          if-no-files-found: error

      - name: Verify Go-only route ownership
        shell: bash
        run: |
          probe_route() {
            local method="$1"
            local path="$2"
            local expected_status="$3"
            local headers="$RUNNER_TEMP/route-$(printf '%s' "$path" | tr '/?' '--').headers"
            local status
            status=$(curl --request "$method" --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "http://127.0.0.1:3002$path")
            test "$status" = "$expected_status"
            grep -qi '^X-All-Mail-Route-Owner: go-business-api' "$headers"
          }
          probe_route GET /admin/emails 401
          probe_route GET /admin/domains 401
          probe_route GET /admin/domain-messages 401
          probe_route GET /admin/forwarding-jobs 401
          probe_route GET /admin/oauth/configs 401
          probe_route GET /admin/send/configs 401
          probe_route POST /mail/api/send 401
          probe_route GET '/api/messages/text?email=probe@example.test' 401
          probe_route POST /api/domain-mail/messages/text 401
          probe_route GET /oauth 302

      - name: Check independent worker doctors
        run: |
          docker compose exec -T app allmail doctor api
          docker compose exec -T go-business-api allmail doctor business-api
          docker compose exec -T worker-forwarding allmail doctor worker forwarding
          docker compose exec -T worker-retention allmail doctor worker retention

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [dependency-audit, docker-smoke]
    steps:
      - name: Require audit and Docker smoke success
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DOCKER_RESULT: ${{ needs.docker-smoke.result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$DOCKER_RESULT" = "success"
