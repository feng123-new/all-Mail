name: Agent runtime naming trigger

on:
  push:
    branches: [agent/retire-migration-era-names]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/retire-migration-era-names
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Execute staged publisher
        shell: bash
        run: |
          set -euo pipefail
          # This second branch push ensures GitHub has already indexed the trigger workflow.
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-runtime-name-publisher.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          lines = source[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/all-mail-runtime-name-publisher.sh').write_text(script, encoding='utf-8')
          PY
          rm .github/workflows/agent-runtime-name-trigger.yml
          bash /tmp/all-mail-runtime-name-publisher.sh
