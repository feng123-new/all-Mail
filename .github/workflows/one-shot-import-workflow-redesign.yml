name: One-shot mailbox import workflow redesign

on:
  push:
    branches:
      - agent/import-workflow-redesign

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stabilize responsive breakpoint defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('web/src/pages/emails/index.tsx'): [
                  ('const useCompactActions = screens.md === false;', 'const useCompactActions = screens.xs === true;'),
              ],
              Path('web/src/pages/emails/ImportWorkflow.tsx'): [
                  ('const isMobile = screens.md === false;', 'const isMobile = screens.xs === true;'),
              ],
              Path('web/e2e/mailbox-import-workflow.spec.ts'): [
                  ("'not-an-email----bad-password',", "'broken@invalid----bad-password',"),
                  ("expect(payload?.content).not.toContain('not-an-email');", "expect(payload?.content).not.toContain('broken@invalid');"),
                  ("'not-an-email----bad-password',", "'broken@invalid----bad-password',"),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text()
              for old, new in pairs:
                  count = source.count(old)
                  if count < 1:
                      raise SystemExit(f'{path}: expected at least one match for {old!r}')
                  source = source.replace(old, new)
              path.write_text(source)
          PY
          git diff --check
          git config user.name "all-Mail frontend agent"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/pages/emails/index.tsx web/src/pages/emails/ImportWorkflow.tsx web/e2e/mailbox-import-workflow.spec.ts
          git commit -m "fix(web): stabilize responsive import workflow breakpoints [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web ci

      - name: Lint frontend
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh npm --prefix web run lint 2>&1 | tee "$RUNNER_TEMP/import-redesign-lint.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Run frontend unit tests
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh npm --prefix web run test 2>&1 | tee "$RUNNER_TEMP/import-redesign-unit.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Build frontend
        shell: bash
        run: |
          set +e
          ./scripts/sanitize-runtime-env.sh npm --prefix web run build 2>&1 | tee "$RUNNER_TEMP/import-redesign-build.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Check frontend build budget
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web run check:budget

      - name: Install isolated Playwright dependency
        shell: bash
        run: |
          playwright_home="$RUNNER_TEMP/import-redesign-playwright"
          mkdir -p "$playwright_home"
          ./scripts/sanitize-runtime-env.sh npm --prefix "$playwright_home" install \
            --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          rm -rf web/node_modules/@playwright
          ln -s "$playwright_home/node_modules/@playwright" web/node_modules/@playwright
          (cd web && ../scripts/sanitize-runtime-env.sh \
            "$playwright_home/node_modules/.bin/playwright" install --with-deps chromium)

      - name: Run desktop and mobile browser regressions
        shell: bash
        run: |
          set +e
          playwright_home="$RUNNER_TEMP/import-redesign-playwright"
          (cd web && ../scripts/sanitize-runtime-env.sh \
            "$playwright_home/node_modules/.bin/playwright" test) \
            2>&1 | tee "$RUNNER_TEMP/import-redesign-playwright.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Write redesign manifest
        if: always()
        run: |
          cat > "$RUNNER_TEMP/import-redesign-manifest.txt" <<EOF
          repository=${GITHUB_REPOSITORY}
          source_commit=${GITHUB_SHA}
          tested_commit=$(git rev-parse HEAD)
          branch=${GITHUB_REF_NAME}
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          scope=three-step-import,mobile-full-screen-drawer,masked-preview,line-error-mapping,failed-row-retry,compact-mobile-actions
          EOF

      - name: Upload browser and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mailbox-import-workflow-redesign
          path: |
            ${{ runner.temp }}/import-redesign-lint.log
            ${{ runner.temp }}/import-redesign-unit.log
            ${{ runner.temp }}/import-redesign-build.log
            ${{ runner.temp }}/import-redesign-playwright.log
            ${{ runner.temp }}/import-redesign-manifest.txt
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7
