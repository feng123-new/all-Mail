name: PR32 gateway ownership test fix

on:
  push:
    branches:
      - agent/go-dashboard-log-writes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-dashboard-log-writes
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Apply reviewed gateway-test correction
        run: |
          python3 scripts/pr32_fix_gateway_tests.py
          gofmt -w core/internal/httpapi/server_test.go
          git diff --check
      - name: Verify gateway tests
        working-directory: core
        run: go test -race ./internal/httpapi ./internal/routeownership
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/internal/httpapi/server_test.go
          git commit -m "test(gateway): expect Go-owned Dashboard log writes"
          git push origin HEAD:agent/go-dashboard-log-writes
