name: Agent apply and verify all-Mail v2.0.1

on:
  push:
    branches:
      - agent/release-v2.0.1

permissions:
  contents: write

concurrency:
  group: agent-release-v2.0.1-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/release-v2.0.1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/workers/allmail-edge/package-lock.json

      - name: Apply, test, and commit the reviewed patch
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail

            git fetch origin \
              refs/heads/agent/release-v2.0.1-scaffold:refs/remotes/origin/agent/release-v2.0.1-scaffold

            for file in \
              agent-release-v2.0.1-core.py \
              agent-release-v2.0.1-core2.py \
              agent-release-v2.0.1-release.py \
              agent-release-v2.0.1-release2.py; do
              git show "origin/agent/release-v2.0.1-scaffold:scripts/${file}" > "scripts/${file}"
            done

            python3 scripts/agent-release-v2.0.1-core2.py
            python3 scripts/agent-release-v2.0.1-release2.py

            gofmt -w \
              core/internal/businessapi/server.go \
              core/internal/businessapi/provider_network.go \
              core/internal/businessapi/provider_network_test.go \
              core/internal/businessapi/mail_http_client.go \
              core/internal/businessapi/mail_http_client_test.go \
              core/internal/businessapi/mail_provider_imap_smtp.go \
              core/internal/businessapi/mail_provider_integration_test.go \
              core/internal/businessapi/auth_handlers.go \
              core/internal/businessapi/mailbox_auth_handlers.go \
              core/internal/businessapi/session_cookie.go \
              core/internal/businessapi/session_cookie_test.go

            ./scripts/sanitize-runtime-env.sh npm --prefix web ci
            ./scripts/sanitize-runtime-env.sh npm --prefix cloudflare/workers/allmail-edge ci

            cd core
            go test -race -run \
              'TestProviderNetworkPolicy|TestProviderProxyInputNormalizationAndTransport|TestSessionCookiesMatchConfiguredJWTLifetime|TestMailAccountExportRequiresSuperAdministrator' \
              -count=1 ./internal/businessapi
            cd ..

            ./scripts/sanitize-runtime-env.sh node --test \
              scripts/release-contract.test.mjs \
              scripts/runtime-environment-cleanup.test.mjs
            ./scripts/sanitize-runtime-env.sh npm --prefix cloudflare/workers/allmail-edge test
            ./scripts/sanitize-runtime-env.sh npm --prefix web test -- \
              --run src/__tests__/app-auth-routes.test.tsx

            ./scripts/sanitize-runtime-env.sh npm run verify:release

            cp .env.example .env
            POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef \
              docker compose config --quiet
            POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef \
              docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
            POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef \
              docker compose -f docker-compose.yml -f docker-compose.init.yml config --quiet
            rm -f .env

            test "$(tr -d '[:space:]' < VERSION)" = "2.0.1"
            test "$(node -p "require('./package.json').version")" = "2.0.1"
            grep -Fqx '## [2.0.1] - 2026-08-03' CHANGELOG.md
            grep -Fq 'cross-platform-release-builds' .github/workflows/release.yml
            ! grep -R -n \
              'ensure-ingress-endpoint\|serverDir' \
              cloudflare/workers/allmail-edge/bin
            git diff --check
          ) 2>&1 | tee /tmp/all-mail-v2.0.1-finalizer.log
          status=${PIPESTATUS[0]}
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$status" != "0" ]]; then
            tail -n 600 /tmp/all-mail-v2.0.1-finalizer.log > /tmp/failure.log
            git reset --hard HEAD
            git clean -fd
            {
              printf 'all-Mail v2.0.1 finalizer exit status: %s\n\n' "$status"
              cat /tmp/failure.log
            } > .agent-v2.0.1-failure.log
            git add .agent-v2.0.1-failure.log
            git commit -m "test(release): capture v2.0.1 finalizer failure"
            git push origin HEAD:agent/release-v2.0.1
            exit "$status"
          fi

          rm -f \
            scripts/agent-release-v2.0.1-core.py \
            scripts/agent-release-v2.0.1-core2.py \
            scripts/agent-release-v2.0.1-release.py \
            scripts/agent-release-v2.0.1-release2.py \
            .agent-v2.0.1-failure.log

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The v2.0.1 finalizer produced no repository changes.' >&2
            exit 1
          fi

          git commit -m "release: prepare all-Mail v2.0.1 [release:v2.0.1]"
          git push origin HEAD:agent/release-v2.0.1
          git push origin --delete agent/release-v2.0.1-scaffold || true
