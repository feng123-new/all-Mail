name: Full-stack consistency contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-consistency-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-unreleased:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/changelog-drift-guard'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metadata branch
        uses: actions/checkout@v7
        with:
          ref: agent/changelog-drift-guard
          fetch-depth: 0

      - name: Populate and commit Unreleased section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          source = path.read_text()
          old = '## [Unreleased]\n\nNo unreleased changes.\n'
          new = '''## [Unreleased]

### Security

- Removed the undocumented production `RESEND_API_BASE_URL` shell override; the supported Compose topology now fixes the forwarding provider endpoint to `https://api.resend.com`.
- Removed the undocumented frontend `VITE_API_BASE_URL` build override so administrator and mailbox requests always use relative same-origin paths through the public Go gateway.

### Added

- Added a permanent full-stack consistency contract covering environment ownership, resolved Compose configuration, React routes and navigation, frontend requests, Go method/path handlers, route ownership, page regression visibility, repository hygiene, and dependency reproducibility.
- Added Cookie/OTP fixture coverage for the local Gmail OAuth helper and method-aware coverage for every public Go business route.

### Changed

- Registered API-key allocation, usage, reset, and mailbox-assignment routes explicitly so frontend/backend method and path compatibility can be verified statically.
- Migrated the optional Gmail OAuth helper to the current administrator Cookie session, server-driven OTP challenge, mandatory password-rotation guard, safe account verification, and canonical Google `manage` scopes.

### Compatibility

- These unreleased changes add no database migration, durable-secret rotation, public route removal, authorization change, provider credential-format change, or production service/network/volume topology change.
'''
          if old not in source:
              raise SystemExit('expected empty Unreleased section not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs(release): record unreleased consistency fixes'
          git push origin HEAD:agent/changelog-drift-guard

  consistency-contract:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install exact frontend parser dependencies
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web ci

      - name: Fetch stable release tags
        run: git fetch origin --tags --force

      - name: Verify release-to-main changelog state
        run: ./scripts/sanitize-runtime-env.sh node --test scripts/unreleased-changelog-contract.test.mjs

      - name: Resolve canonical Compose model
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/allmail-compose.json"

      - name: Run repository, environment, route, and feature audit
        env:
          ALLMAIL_AUDIT_COMPOSE_JSON: ${{ runner.temp }}/allmail-compose.json
        run: ./scripts/sanitize-runtime-env.sh node scripts/full-stack-consistency-audit.mjs

      - name: Verify Gmail OAuth helper compatibility
        run: |
          python3 -m py_compile gmail_oauth/gmail_oauth_auto.py gmail_oauth/admin_client.py
          python3 -m unittest discover -s gmail_oauth -p 'test_*.py'

      - name: Upload consistency inventories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-consistency-contract-report
          path: audit-output
          if-no-files-found: error

  dependency-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/workers/allmail-edge/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Install exact JavaScript dependency trees
        run: |
          ./scripts/sanitize-runtime-env.sh npm --prefix web ci
          ./scripts/sanitize-runtime-env.sh npm --prefix cloudflare/workers/allmail-edge ci

      - name: Regenerate dependency metadata without changing versions
        run: |
          ./scripts/sanitize-runtime-env.sh npm --prefix web install --package-lock-only --ignore-scripts
          ./scripts/sanitize-runtime-env.sh npm --prefix cloudflare/workers/allmail-edge install --package-lock-only --ignore-scripts
          (cd core && go mod tidy)

      - name: Reject lockfile or Go module drift
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- \
            web/package-lock.json \
            cloudflare/workers/allmail-edge/package-lock.json \
            core/go.mod \
            core/go.sum
