name: Enforce frontend same-origin base

on:
  push:
    branches: [agent/full-stack-consistency-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: agent/full-stack-consistency-audit
          fetch-depth: 0

      - name: Remove undocumented API base override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/src/api/core.ts')
          source = path.read_text()
          source = source.replace("const API_BASE_URL = import.meta.env.VITE_API_BASE_URL || '';\n\n", '')
          source = source.replace('    baseURL: API_BASE_URL,', "    baseURL: '',")
          if 'VITE_API_BASE_URL' in source or 'baseURL: API_BASE_URL' in source:
              raise SystemExit('frontend API base override was not fully removed')
          path.write_text(source)
          PY
          git diff --check

      - name: Commit same-origin client contract
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/src/api/core.ts; then
            echo 'frontend client is already same-origin only'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/api/core.ts
          git commit -m 'fix(frontend): enforce same-origin API requests'
          git push origin HEAD:agent/full-stack-consistency-audit
