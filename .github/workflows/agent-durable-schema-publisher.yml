name: Agent durable schema publisher

on:
  push:
    branches: [agent/durable-config-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/durable-config-migration
          fetch-depth: 0
      - name: Detect schema marker
        id: marker
        shell: bash
        run: |
          if test -f .agent/apply-durable-schema; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply Prisma durable-config fields
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/prisma/schema.prisma')
          text = path.read_text()
          old_domain = '''  canSend                Boolean       @default(false) @map("can_send")
  isCatchAllEnabled      Boolean       @default(false) @map("is_catch_all_enabled")'''
          new_domain = '''  canSend                Boolean       @default(false) @map("can_send")
  sendApproved           Boolean       @default(false) @map("send_approved")
  sendApprovedAt         DateTime?     @map("send_approved_at")
  sendApprovalSource     String?       @map("send_approval_source") @db.VarChar(50)
  isCatchAllEnabled      Boolean       @default(false) @map("is_catch_all_enabled")'''
          old_ingress = '''  signingKeyHash String?  @map("signing_key_hash") @db.VarChar(64)
  status         Status   @default(ACTIVE)'''
          new_ingress = '''  signingKeyHash         String?  @map("signing_key_hash") @db.VarChar(64)
  signingSecretEncrypted String?  @map("signing_secret_encrypted") @db.Text
  status                 Status   @default(ACTIVE)'''
          for old, new in ((old_domain, new_domain), (old_ingress, new_ingress)):
              if old not in text:
                  raise SystemExit(f'expected schema fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -rf .agent
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(config): model durable configuration fields'
          git push origin HEAD:agent/durable-config-migration
