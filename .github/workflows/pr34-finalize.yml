name: PR34 finalize database management cutover

on:
  push:
    branches:
      - agent/go-database-admin-writes

permissions:
  contents: write

concurrency:
  group: pr34-finalize-database-management
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-database-admin-writes
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Apply route, contract and documentation changes
        run: python3 scripts/pr34_finalize.py
      - name: Resolve Go password dependency and validate
        run: |
          cd core
          go get golang.org/x/crypto/bcrypt@latest
          go mod tidy
          gofmt -w ./internal/businessapi ./internal/routeownership
          go test -race ./internal/businessapi ./internal/routeownership ./internal/config
          go vet ./...
          go build -trimpath -o /tmp/allmail ./cmd/allmail
      - name: Validate repository contracts
        run: |
          git diff --check
          bash -n scripts/bootstrap-admin-docker-smoke.sh
          node --test scripts/*.test.mjs
          cp .env.example .env
          POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef docker compose config --quiet
      - name: Commit finalized source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/go.mod core/go.sum core/internal/businessapi core/internal/routeownership/manifest_test.go \
            config/route-ownership.json scripts/route-ownership.test.mjs scripts/bootstrap-admin-docker-smoke.sh \
            CHANGELOG.md docs/GO-MIGRATION.md docs/internal/runtime-migration-roadmap.md
          git rm scripts/pr34_finalize.py
          git commit -m "feat(go-business): migrate database administration surfaces"
          git push origin HEAD:agent/go-database-admin-writes
