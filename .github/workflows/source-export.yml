name: Apply staged v2.1.2 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/v2.1.2-closeout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply the staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/v2.1.2-closeout"

          cat .github/v2.1.2-patch/gz-* \
            | base64 --decode \
            > "$RUNNER_TEMP/v2.1.2.patch.gz"
          echo "eab87b9e5a3d1fd7ac9c84ec5c2fd439c693ddb5426dd705811a70dfc95556dc  $RUNNER_TEMP/v2.1.2.patch.gz" \
            | sha256sum --check -

          gzip --decompress --stdout "$RUNNER_TEMP/v2.1.2.patch.gz" \
            > "$RUNNER_TEMP/v2.1.2.patch"
          echo "a9559dad9f686931ee7ba64d19375408685ce671a77114c328d828e7782f41ac  $RUNNER_TEMP/v2.1.2.patch" \
            | sha256sum --check -

          git apply --check "$RUNNER_TEMP/v2.1.2.patch"
          git apply --index "$RUNNER_TEMP/v2.1.2.patch"
          git rm .github/workflows/source-export.yml
          git rm --recursive .github/v2.1.2-patch

          test "$(tr -d '[:space:]' < VERSION)" = "2.1.2"
          test "$(node -p "require('./package.json').version")" = "2.1.2"
          git diff --cached --check

      - name: Commit the final release patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: publish all-Mail v2.1.2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
