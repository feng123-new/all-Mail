name: Patch PR28 bootstrap fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/go-business-api-key-external'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-business-api-key-external
          fetch-depth: 0
      - name: Patch bootstrap SQL timestamps
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/pr28-bootstrap-source.yml
          if [ ! -f "$source_file" ]; then
            echo 'Bootstrap source already patched.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr28-bootstrap-source.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "INSERT INTO email_groups (name) VALUES ('ci-primary') RETURNING id": "INSERT INTO email_groups (name, updated_at) VALUES ('ci-primary', CURRENT_TIMESTAMP) RETURNING id",
              "INSERT INTO email_accounts (email, provider, auth_type, status, group_id) VALUES ('pool-ci@example.com', 'GMAIL', 'GOOGLE_OAUTH', 'ACTIVE', $group_id) RETURNING id": "INSERT INTO email_accounts (email, provider, auth_type, status, group_id, updated_at) VALUES ('pool-ci@example.com', 'GMAIL', 'GOOGLE_OAUTH', 'ACTIVE', $group_id, CURRENT_TIMESTAMP) RETURNING id",
              "INSERT INTO domains (name, status, can_receive, can_send, created_by_admin_id) VALUES ('ci.example', 'ACTIVE', TRUE, TRUE, $admin_id) RETURNING id": "INSERT INTO domains (name, status, can_receive, can_send, created_by_admin_id, updated_at) VALUES ('ci.example', 'ACTIVE', TRUE, TRUE, $admin_id, CURRENT_TIMESTAMP) RETURNING id",
              "INSERT INTO domain_mailboxes (domain_id, local_part, address, status, provisioning_mode, batch_tag) VALUES ($domain_id, 'pool', 'pool@ci.example', 'ACTIVE', 'API_POOL', 'ci-batch') RETURNING id": "INSERT INTO domain_mailboxes (domain_id, local_part, address, status, provisioning_mode, batch_tag, updated_at) VALUES ($domain_id, 'pool', 'pool@ci.example', 'ACTIVE', 'API_POOL', 'ci-batch', CURRENT_TIMESTAMP) RETURNING id",
              "INSERT INTO inbound_messages (domain_id, mailbox_id, matched_address, final_address, delivery_key, from_address, to_address, subject, text_preview, received_at) VALUES ($domain_id, $mailbox_id, 'pool@ci.example', 'pool@ci.example', 'ci-delivery', 'sender@example.net', 'pool@ci.example', 'CI verification 654321', 'verification code 654321', CURRENT_TIMESTAMP)": "INSERT INTO inbound_messages (domain_id, mailbox_id, matched_address, final_address, delivery_key, from_address, to_address, subject, text_preview, received_at, updated_at) VALUES ($domain_id, $mailbox_id, 'pool@ci.example', 'pool@ci.example', 'ci-delivery', 'sender@example.net', 'pool@ci.example', 'CI verification 654321', 'verification code 654321', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected bootstrap SQL: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$source_file"
          git commit -m 'test(pr28): patch bootstrap fixture timestamps'
          git push origin HEAD:agent/go-business-api-key-external
