name: v2 lock hotfix materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v2-lock-hotfix-materializer
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.head_ref == 'fix/v2-cross-platform-secret-lock' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: fix/v2-cross-platform-secret-lock
          fetch-depth: 0

      - name: Detect materialized implementation
        id: detect
        shell: bash
        run: |
          if [[ -f core/internal/secretstate/filelock_windows.go ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Apply platform lock implementation
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/internal/secretstate/secretstate.go")
          content = path.read_text(encoding="utf-8")
          content = content.replace('\t"syscall"\n', '', 1)
          old = '''\tdeadline := time.Now().Add(timeout)
          \tfor {
          \t\terr = syscall.Flock(int(lockFile.Fd()), syscall.LOCK_EX|syscall.LOCK_NB)
          \t\tif err == nil {
          \t\t\tbreak
          \t\t}
          \t\tif !errors.Is(err, syscall.EWOULDBLOCK) && !errors.Is(err, syscall.EAGAIN) {
          \t\t\treturn fmt.Errorf("lock runtime secret state: %w", err)
          \t\t}
          \t\tif time.Now().After(deadline) {
          \t\t\treturn fmt.Errorf("timed out after %s waiting for runtime secret lock", timeout)
          \t\t}
          \t\ttime.Sleep(100 * time.Millisecond)
          \t}
          \tdefer syscall.Flock(int(lockFile.Fd()), syscall.LOCK_UN)
          \treturn run()
          '''
          new = '''\tdeadline := time.Now().Add(timeout)
          \tfor {
          \t\tlocked, lockErr := tryLockFile(lockFile)
          \t\tif lockErr != nil {
          \t\t\treturn fmt.Errorf("lock runtime secret state: %w", lockErr)
          \t\t}
          \t\tif locked {
          \t\t\tbreak
          \t\t}
          \t\tif time.Now().After(deadline) {
          \t\t\treturn fmt.Errorf("timed out after %s waiting for runtime secret lock", timeout)
          \t\t}
          \t\ttime.Sleep(100 * time.Millisecond)
          \t}
          \tdefer func() {
          \t\t_ = unlockFile(lockFile)
          \t}()
          \treturn run()
          '''
          if old not in content:
              raise SystemExit("secretstate WithLock block did not match expected source")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

          cat > core/internal/secretstate/filelock_unix.go <<'EOF'
          //go:build !windows

          package secretstate

          import (
          	"errors"
          	"os"
          	"syscall"
          )

          func tryLockFile(file *os.File) (bool, error) {
          	err := syscall.Flock(int(file.Fd()), syscall.LOCK_EX|syscall.LOCK_NB)
          	if err == nil {
          		return true, nil
          	}
          	if errors.Is(err, syscall.EWOULDBLOCK) || errors.Is(err, syscall.EAGAIN) {
          		return false, nil
          	}
          	return false, err
          }

          func unlockFile(file *os.File) error {
          	return syscall.Flock(int(file.Fd()), syscall.LOCK_UN)
          }
          EOF

          cat > core/internal/secretstate/filelock_windows.go <<'EOF'
          //go:build windows

          package secretstate

          import (
          	"fmt"
          	"os"
          	"runtime"
          	"syscall"
          	"unsafe"
          )

          const (
          	lockFileFailImmediately = 0x00000001
          	lockFileExclusiveLock   = 0x00000002
          	errorLockViolation      = syscall.Errno(33)
          )

          var (
          	kernel32DLL       = syscall.NewLazyDLL("kernel32.dll")
          	lockFileExProc    = kernel32DLL.NewProc("LockFileEx")
          	unlockFileExProc  = kernel32DLL.NewProc("UnlockFileEx")
          )

          func tryLockFile(file *os.File) (bool, error) {
          	var overlapped syscall.Overlapped
          	result, _, callErr := lockFileExProc.Call(
          		file.Fd(),
          		uintptr(lockFileFailImmediately|lockFileExclusiveLock),
          		0,
          		1,
          		0,
          		uintptr(unsafe.Pointer(&overlapped)),
          	)
          	runtime.KeepAlive(file)
          	if result != 0 {
          		return true, nil
          	}
          	if errno, ok := callErr.(syscall.Errno); ok {
          		if errno == errorLockViolation {
          			return false, nil
          		}
          		if errno == 0 {
          			callErr = syscall.EINVAL
          		}
          	}
          	return false, fmt.Errorf("LockFileEx: %w", callErr)
          }

          func unlockFile(file *os.File) error {
          	var overlapped syscall.Overlapped
          	result, _, callErr := unlockFileExProc.Call(
          		file.Fd(),
          		0,
          		1,
          		0,
          		uintptr(unsafe.Pointer(&overlapped)),
          	)
          	runtime.KeepAlive(file)
          	if result != 0 {
          		return nil
          	}
          	if errno, ok := callErr.(syscall.Errno); ok && errno == 0 {
          		callErr = syscall.EINVAL
          	}
          	return fmt.Errorf("UnlockFileEx: %w", callErr)
          }
          EOF

          cat > core/internal/secretstate/filelock_test.go <<'EOF'
          package secretstate

          import (
          	"os"
          	"path/filepath"
          	"testing"
          )

          func TestFileLockIsExclusiveAndReusable(t *testing.T) {
          	path := filepath.Join(t.TempDir(), "exclusive.lock")
          	first, err := os.OpenFile(path, os.O_CREATE|os.O_RDWR, 0o600)
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer first.Close()
          	second, err := os.OpenFile(path, os.O_CREATE|os.O_RDWR, 0o600)
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer second.Close()

          	locked, err := tryLockFile(first)
          	if err != nil || !locked {
          		t.Fatalf("first lock: locked=%v err=%v", locked, err)
          	}
          	defer func() { _ = unlockFile(first) }()

          	locked, err = tryLockFile(second)
          	if err != nil {
          		t.Fatalf("contended lock: %v", err)
          	}
          	if locked {
          		t.Fatal("second handle acquired an already held lock")
          	}

          	if err := unlockFile(first); err != nil {
          		t.Fatal(err)
          	}
          	locked, err = tryLockFile(second)
          	if err != nil || !locked {
          		t.Fatalf("reused lock: locked=%v err=%v", locked, err)
          	}
          	if err := unlockFile(second); err != nil {
          		t.Fatal(err)
          	}
          }
          EOF

          gofmt -w core/internal/secretstate/secretstate.go \
            core/internal/secretstate/filelock_unix.go \
            core/internal/secretstate/filelock_windows.go \
            core/internal/secretstate/filelock_test.go

      - name: Verify native tests and six release targets
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd core
          go test ./internal/secretstate
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [[ "$goos" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -buildvcs=false -trimpath \
              -o "$RUNNER_TEMP/allmail-${goos}-${goarch}${suffix}" ./cmd/allmail
          done

      - name: Commit materialized hotfix
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "feng123-new"
          git config user.email "203426027+feng123-new@users.noreply.github.com"
          git add core/internal/secretstate
          git commit -m "fix(release): make runtime secret locking cross-platform [materialized]"
          git push origin HEAD:fix/v2-cross-platform-secret-lock
