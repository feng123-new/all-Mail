name: Frontend lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frontend-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/frontend-v3-release-pr59'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate lockfile from reviewed package metadata
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web install --package-lock-only --ignore-scripts

      - name: Commit the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- web/package-lock.json; then
            echo 'package-lock.json is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'fix(deps): refresh fast-uri 4.1.2 lockfile'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
