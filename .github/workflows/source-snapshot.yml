name: Source snapshot

on:
  push:
    branches:
      - agent/final-go-cutover
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: core/go.sum
      - name: Resolve final Go module graph
        working-directory: core
        run: go mod tidy
      - name: Archive source and Go module cache
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=all-mail-source.tar.gz HEAD
          gomodcache="$(go env GOMODCACHE)"
          mkdir -p export
          tar -C "$(dirname "$gomodcache")" -czf export/go-mod-cache.tar.gz "$(basename "$gomodcache")"
          cp core/go.mod core/go.sum export/
          go version > export/go-version.txt
          go env GOMODCACHE >> export/go-version.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: all-mail-source
          path: all-mail-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload Go module cache
        uses: actions/upload-artifact@v4
        with:
          name: all-mail-go-toolchain
          path: export
          if-no-files-found: error
          retention-days: 1
