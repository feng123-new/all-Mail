name: Publish PR28 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/go-business-api-key-external'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-business-api-key-external
          fetch-depth: 0
      - name: Apply staged PR28 payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .github/pr28-workflow-payload ]; then
            echo 'No staged PR28 workflow payload remains.'
            exit 0
          fi
          cat .github/pr28-workflow-payload/part-* > "$RUNNER_TEMP/pr28-workflows.b64"
          test "$(wc -c < "$RUNNER_TEMP/pr28-workflows.b64")" = "9616"
          echo '05a163aa6ca8f1844542911837fc0584738133834988585c9acfc6fc4b3108e6  '"$RUNNER_TEMP/pr28-workflows.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/pr28-workflows.b64" > "$RUNNER_TEMP/pr28-workflows.tar.gz"
          echo 'c8bba1fe14f1069a5ae7904d0aa2c34bcedc384bcfacc0c96926e97060269153  '"$RUNNER_TEMP/pr28-workflows.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pr28-workflows.tar.gz" -C .
          rm -rf .github/pr28-workflow-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(pr28): stage validated workflow blobs'
          git push origin HEAD:agent/go-business-api-key-external
