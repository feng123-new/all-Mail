name: PR35 source snapshot

on:
  push:
    branches:
      - agent/go-mail-operations
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-mail-operations
          fetch-depth: 1
      - name: Package source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/all-mail-pr35-source.tgz" .
      - uses: actions/upload-artifact@v7
        with:
          name: pr35-source-tree
          path: ${{ runner.temp }}/all-mail-pr35-source.tgz
          if-no-files-found: error
          retention-days: 1
