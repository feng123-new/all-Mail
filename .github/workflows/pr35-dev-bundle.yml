name: PR35 development bundle

on:
  push:
    branches:
      - agent/go-mail-operations
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-mail-operations
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Prepare patched source and module cache
        shell: bash
        run: |
          set +e
          python3 scripts/pr35_foundation_patch.py
          cd core
          go get github.com/emersion/go-imap@v1.2.1
          go get github.com/emersion/go-message@v0.18.2
          go mod tidy
          cd ..
          set -e
          tar --exclude=.git -czf "$RUNNER_TEMP/pr35-patched-source.tgz" .
          goroot="$(go env GOROOT)"
          gomodcache="$(go env GOMODCACHE)"
          tar -C "$(dirname "$goroot")" -czf "$RUNNER_TEMP/go-root.tgz" "$(basename "$goroot")"
          tar -C "$(dirname "$gomodcache")" -czf "$RUNNER_TEMP/go-mod-cache.tgz" "$(basename "$gomodcache")"
      - uses: actions/upload-artifact@v7
        with:
          name: pr35-development-bundle
          path: |
            ${{ runner.temp }}/pr35-patched-source.tgz
            ${{ runner.temp }}/go-root.tgz
            ${{ runner.temp }}/go-mod-cache.tgz
          if-no-files-found: error
          retention-days: 1
