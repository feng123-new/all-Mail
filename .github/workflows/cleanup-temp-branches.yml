name: Cleanup temporary documentation branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            docs/readme-preview-final \
            docs/readme-preview-final-2 \
            docs/readme-preview-final-pr \
            noop-check
          do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "deleted $branch"
            else
              echo "already absent: $branch"
            fi
          done

      - name: Remove one-off cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-temp-branches.yml
          git commit -m "chore: remove temporary branch cleanup workflow"
          git push origin HEAD:main
