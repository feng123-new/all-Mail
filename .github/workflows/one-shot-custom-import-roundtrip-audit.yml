name: One-shot custom import round-trip audit

on:
  push:
    branches:
      - fix/custom-imap-export-roundtrip

permissions:
  contents: read

jobs:
  realistic-import-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allmail_import_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allmail_import_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check formatting and patch cleanliness
        run: |
          test -z "$(gofmt -l core/internal/businessapi/mail_account_import_export.go core/internal/businessapi/realistic_import_audit_test.go)"
          git diff --check

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Migrate isolated import database
        working-directory: core
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_import_audit?sslmode=disable
          ALL_MAIL_MIGRATION_DIR: ${{ github.workspace }}/core/migrations
        run: |
          go build -trimpath -o ./allmail ./cmd/allmail
          ./allmail migrate

      - name: Run realistic parser and PostgreSQL round-trip audit
        working-directory: core
        shell: bash
        env:
          ALLMAIL_GO_BUSINESS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allmail_import_audit?sslmode=disable
        run: |
          set +e
          go test -v -count=1 -run '^(TestRealisticImportParserAudit|TestPostgresRealisticImportRoundTripAudit)$' ./internal/businessapi 2>&1 | tee "$RUNNER_TEMP/realistic-import-go.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Install frontend dependencies
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web ci

      - name: Install isolated Playwright browser audit dependency
        shell: bash
        run: |
          playwright_home="$RUNNER_TEMP/import-audit-playwright"
          mkdir -p "$playwright_home"
          ./scripts/sanitize-runtime-env.sh npm --prefix "$playwright_home" install \
            --no-save --no-package-lock --ignore-scripts @playwright/test@1.55.0
          rm -rf web/node_modules/@playwright
          ln -s "$playwright_home/node_modules/@playwright" web/node_modules/@playwright
          (cd web && ../scripts/sanitize-runtime-env.sh \
            "$playwright_home/node_modules/.bin/playwright" install --with-deps chromium)

      - name: Capture current import workflow on desktop and mobile
        shell: bash
        env:
          CI: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/e2e/import-ui-audit.spec.ts')
          source = path.read_text()
          source = source.replace(
              "await expect(page.getByText('audit-hotmail@hotmail.com')).toBeVisible();",
              "await expect(page.locator('.ant-table-tbody').getByText('audit-hotmail@hotmail.com', { exact: true })).toBeVisible();",
          )
          source = source.replace(
              "await expect(page.getByText('audit-mailcom@mail.com')).toBeVisible();",
              "await expect(page.locator('.ant-table-tbody').getByText('audit-mailcom@mail.com', { exact: true })).toBeVisible();",
          )
          path.write_text(source)
          PY
          set +e
          playwright_home="$RUNNER_TEMP/import-audit-playwright"
          (cd web && ../scripts/sanitize-runtime-env.sh \
            "$playwright_home/node_modules/.bin/playwright" test e2e/import-ui-audit.spec.ts --reporter=line,html) \
            2>&1 | tee "$RUNNER_TEMP/import-audit-playwright.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Write audit manifest
        if: always()
        run: |
          cat > "$RUNNER_TEMP/import-audit-manifest.txt" <<EOF
          repository=feng123-new/all-Mail
          tested_commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          scenarios=hotmail-vendor,gmail-oauth,qq-app-password,mailcom-app-password,custom-imap-smtp,two-invalid-lines
          viewports=desktop-1440x900,mobile-390x844
          EOF

      - name: Upload import audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: realistic-import-ui-audit-fixed
          path: |
            ${{ runner.temp }}/realistic-import-go.log
            ${{ runner.temp }}/import-audit-playwright.log
            ${{ runner.temp }}/import-audit-manifest.txt
            web/import-audit-shots
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7
