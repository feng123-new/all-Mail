name: PR31 bootstrap session patch

on:
  push:
    branches:
      - agent/oauth-session-security

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/oauth-session-security
          fetch-depth: 0
      - name: Update bootstrap verification
        run: python3 scripts/pr31_fix_bootstrap.py
      - name: Validate and commit
        run: |
          git diff --check
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap-admin-security.yml
          git commit -m "test(auth): verify stale and rotated administrator sessions"
          git push origin HEAD:agent/oauth-session-security
