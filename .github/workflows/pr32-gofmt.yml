name: PR32 gofmt correction

on:
  push:
    branches:
      - agent/go-dashboard-log-writes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-dashboard-log-writes
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Format and verify Dashboard write tests
        run: |
          gofmt -w core/internal/businessapi/dashboard_write_test.go
          git diff --check
          test -z "$(gofmt -l core/internal/businessapi/dashboard_write_test.go)"
          cd core
          go test -race ./internal/businessapi
      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/internal/businessapi/dashboard_write_test.go
          git commit -m "style(go-business): format Dashboard write tests"
          git push origin HEAD:agent/go-dashboard-log-writes
