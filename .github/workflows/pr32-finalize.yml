name: PR32 final coordinated cleanup

on:
  push:
    branches:
      - agent/go-dashboard-log-writes

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/go-dashboard-log-writes
          fetch-depth: 0
      - name: Apply final permanent contract updates
        run: |
          python3 scripts/pr32_apply.py
          git diff --check
          grep -q "X-All-Mail-Route-Owner: go-business-api" scripts/bootstrap-admin-docker-smoke.sh
          grep -q "moved Dashboard single and batch operation-log deletion" CHANGELOG.md
      - name: Commit permanent changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md scripts/bootstrap-admin-docker-smoke.sh .github/workflows/ci.yml
          git rm scripts/pr32_apply.py .github/workflows/pr32-finalize.yml
          git commit -m "test(go-business): finalize Dashboard write cutover contracts"
          git push origin HEAD:agent/go-dashboard-log-writes
