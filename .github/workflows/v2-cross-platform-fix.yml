name: V2 cross-platform release fix

on:
  push:
    branches: [agent/fix-v2-cross-platform-release]
    paths:
      - .github/workflows/v2-cross-platform-fix.yml

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-v2-cross-platform-release
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Apply portable file-lock implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('core/internal/secretstate/secretstate.go')
          content = path.read_text()
          old_import = '\t"syscall"\n'
          if content.count(old_import) != 1:
              raise SystemExit('unexpected syscall import count')
          content = content.replace(old_import, '', 1)

          old = '''\tdeadline := time.Now().Add(timeout)
\tfor {
\t\terr = syscall.Flock(int(lockFile.Fd()), syscall.LOCK_EX|syscall.LOCK_NB)
\t\tif err == nil {
\t\t\tbreak
\t\t}
\t\tif !errors.Is(err, syscall.EWOULDBLOCK) && !errors.Is(err, syscall.EAGAIN) {
\t\t\treturn fmt.Errorf("lock runtime secret state: %w", err)
\t\t}
\t\tif time.Now().After(deadline) {
\t\t\treturn fmt.Errorf("timed out after %s waiting for runtime secret lock", timeout)
\t\t}
\t\ttime.Sleep(100 * time.Millisecond)
\t}
\tdefer syscall.Flock(int(lockFile.Fd()), syscall.LOCK_UN)
\treturn run()
'''
          new = '''\tdeadline := time.Now().Add(timeout)
\tfor {
\t\terr = tryExclusiveFileLock(lockFile)
\t\tif err == nil {
\t\t\tbreak
\t\t}
\t\tif !isFileLockContention(err) {
\t\t\treturn fmt.Errorf("lock runtime secret state: %w", err)
\t\t}
\t\tif time.Now().After(deadline) {
\t\t\treturn fmt.Errorf("timed out after %s waiting for runtime secret lock", timeout)
\t\t}
\t\ttime.Sleep(100 * time.Millisecond)
\t}
\tdefer func() { _ = releaseFileLock(lockFile) }()
\treturn run()
'''
          if content.count(old) != 1:
              raise SystemExit('runtime lock block did not match exactly once')
          path.write_text(content.replace(old, new, 1))
          PY

          cat > core/internal/secretstate/filelock_unix.go <<'EOF'
          //go:build unix

          package secretstate

          import (
          	"errors"
          	"os"
          	"syscall"
          )

          func tryExclusiveFileLock(file *os.File) error {
          	return syscall.Flock(int(file.Fd()), syscall.LOCK_EX|syscall.LOCK_NB)
          }

          func releaseFileLock(file *os.File) error {
          	return syscall.Flock(int(file.Fd()), syscall.LOCK_UN)
          }

          func isFileLockContention(err error) bool {
          	return errors.Is(err, syscall.EWOULDBLOCK) || errors.Is(err, syscall.EAGAIN)
          }
          EOF

          cat > core/internal/secretstate/filelock_windows.go <<'EOF'
          //go:build windows

          package secretstate

          import (
          	"errors"
          	"os"
          	"syscall"
          	"unsafe"
          )

          const (
          	lockFileFailImmediately = 0x00000001
          	lockFileExclusiveLock   = 0x00000002

          	errorSharingViolation syscall.Errno = 32
          	errorLockViolation    syscall.Errno = 33
          )

          var (
          	kernel32DLL     = syscall.NewLazyDLL("kernel32.dll")
          	lockFileExProc   = kernel32DLL.NewProc("LockFileEx")
          	unlockFileExProc = kernel32DLL.NewProc("UnlockFileEx")
          )

          func tryExclusiveFileLock(file *os.File) error {
          	var overlapped syscall.Overlapped
          	result, _, callErr := lockFileExProc.Call(
          		file.Fd(),
          		uintptr(lockFileExclusiveLock|lockFileFailImmediately),
          		0,
          		1,
          		0,
          		uintptr(unsafe.Pointer(&overlapped)),
          	)
          	if result != 0 {
          		return nil
          	}
          	if callErr != syscall.Errno(0) {
          		return callErr
          	}
          	return syscall.EINVAL
          }

          func releaseFileLock(file *os.File) error {
          	var overlapped syscall.Overlapped
          	result, _, callErr := unlockFileExProc.Call(
          		file.Fd(),
          		0,
          		1,
          		0,
          		uintptr(unsafe.Pointer(&overlapped)),
          	)
          	if result != 0 {
          		return nil
          	}
          	if callErr != syscall.Errno(0) {
          		return callErr
          	}
          	return syscall.EINVAL
          }

          func isFileLockContention(err error) bool {
          	return errors.Is(err, errorLockViolation) || errors.Is(err, errorSharingViolation)
          }
          EOF

          cat > core/internal/secretstate/filelock_other.go <<'EOF'
          //go:build !unix && !windows

          package secretstate

          import (
          	"errors"
          	"os"
          )

          var errFileLockUnsupported = errors.New("runtime secret file locking is unsupported on this platform")

          func tryExclusiveFileLock(_ *os.File) error {
          	return errFileLockUnsupported
          }

          func releaseFileLock(_ *os.File) error {
          	return nil
          }

          func isFileLockContention(error) bool {
          	return false
          }
          EOF

      - name: Add the cross-platform release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          content = path.read_text()
          anchor = '''      - name: Build
        run: go build -trimpath -o ./allmail ./cmd/allmail

      - name: Install govulncheck
'''
          replacement = '''      - name: Build
        run: go build -trimpath -o ./allmail ./cmd/allmail

      - name: Verify release cross-compilation
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \\
              go build -buildvcs=false -trimpath \\
              -o "$RUNNER_TEMP/allmail-${goos}-${goarch}${suffix}" ./cmd/allmail
          done

      - name: Install govulncheck
'''
          if content.count(anchor) != 1:
              raise SystemExit('CI build anchor did not match exactly once')
          path.write_text(content.replace(anchor, replacement, 1))
          PY

          cat >> scripts/release-contract.test.mjs <<'EOF'

          test("CI cross-compiles every v2 release target", async () => {
            const ci = await read(".github/workflows/ci.yml");
            assert.match(ci, /Verify release cross-compilation/);
            for (const target of [
              "linux/amd64",
              "linux/arm64",
              "darwin/amd64",
              "darwin/arm64",
              "windows/amd64",
              "windows/arm64",
            ]) {
              assert.ok(ci.includes(target), `CI omits ${target}`);
            }
            assert.match(ci, /CGO_ENABLED=0 GOOS=/);
          });
          EOF

          python3 <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          content = path.read_text()
          anchor = '- `allmail version` and `allmail version --json`, populated through Go linker flags and OCI build metadata.\n'
          addition = anchor + '- Platform-specific runtime-secret file locking so the published Linux, macOS, and Windows archives all cross-compile from the verified release source.\n'
          if content.count(anchor) != 1:
              raise SystemExit('changelog anchor did not match exactly once')
          path.write_text(content.replace(anchor, addition, 1))
          PY

      - name: Verify native behavior and all release targets
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w core/internal/secretstate
          (
            cd core
            go test ./internal/secretstate ./cmd/allmail
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
              goos="${target%/*}"
              goarch="${target#*/}"
              suffix=""
              if [[ "$goos" == "windows" ]]; then
                suffix=".exe"
              fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -buildvcs=false -trimpath \
                -o "$RUNNER_TEMP/allmail-${goos}-${goarch}${suffix}" ./cmd/allmail
            done
          )
          node --test scripts/release-contract.test.mjs scripts/runtime-documentation.test.mjs

      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): make v2 archives cross-platform"
          git push origin HEAD:agent/fix-v2-cross-platform-release
