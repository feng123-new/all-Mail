name: Bootstrap administrator security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.mod
            core/go.sum
      - name: Verify Go bootstrap, secret and authentication contracts
        run: go test -race ./internal/initialize ./internal/secretstate ./internal/businessapi

  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web ci
      - name: Lint, test and build frontend
        run: |
          ./scripts/sanitize-runtime-env.sh npm --prefix web run lint
          ./scripts/sanitize-runtime-env.sh npm --prefix web run test
          ./scripts/sanitize-runtime-env.sh npm --prefix web run build
      - name: Check frontend build budget
        run: ./scripts/sanitize-runtime-env.sh npm --prefix web run check:budget
      - name: Install Playwright browser smoke dependency
        run: |
          ./scripts/sanitize-runtime-env.sh npm --prefix web install --no-save --no-package-lock @playwright/test@1.55.0
          (cd web && ../scripts/sanitize-runtime-env.sh npx playwright install --with-deps chromium)
      - name: Run frontend browser smoke
        run: (cd web && ../scripts/sanitize-runtime-env.sh npm run test:browser)
      - name: Upload frontend browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn

  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify secret, route and session contracts
        run: ./scripts/sanitize-runtime-env.sh node --test scripts/*.test.mjs
      - name: Reject removed administrator compatibility paths
        shell: bash
        run: |
          if grep -R -nE \
            --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.yml' --include='*.yaml' \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.test.mjs' \
            'DOMAIN_BOOTSTRAP_ADMIN_USERNAME|DOMAIN_BOOTSTRAP_ADMIN_PASSWORD|ADMIN_2FA_SECRET|legacyEnv|ensureBootstrapAdmin|createBootstrapAdmin|adminId === 0' \
            web scripts docker-compose.yml .env.example; then
            echo 'removed administrator compatibility path remains in production code'
            exit 1
          fi

  docker-bootstrap-flow:
    runs-on: ubuntu-latest
    needs: [go-contract, web-contract, runtime-contract]
    env:
      POSTGRES_PASSWORD: ci-postgres-password-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Prepare canonical environment
        run: cp .env.example .env
      - name: Seed the pre-rename physical runtime-secret volume
        shell: bash
        run: |
          docker volume create all-mail_legacy_runtime_data
          docker run --rm \
            -v all-mail_legacy_runtime_data:/state \
            postgres:16-alpine \
            sh -lc 'printf preserved > /state/pre-rename-volume-marker'
      - name: Start canonical stack
        shell: bash
        run: |
          set +e
          ./scripts/compose-up.sh 2>&1 | tee "$RUNNER_TEMP/bootstrap-docker-start.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Verify bootstrap, session rotation and migrated API paths
        shell: bash
        run: bash scripts/bootstrap-admin-docker-smoke.sh
      - name: Capture Docker diagnostics
        if: always()
        shell: bash
        run: |
          docker compose ps -a --no-trunc > "$RUNNER_TEMP/bootstrap-docker-ps.txt" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/bootstrap-docker.log" 2>&1 || true
      - name: Upload bootstrap Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-admin-docker-diagnostics
          path: |
            ${{ runner.temp }}/bootstrap-docker-start.log
            ${{ runner.temp }}/bootstrap-docker-ps.txt
            ${{ runner.temp }}/bootstrap-docker.log
          if-no-files-found: warn
      - name: Stop stack
        if: always()
        run: docker compose down -v
