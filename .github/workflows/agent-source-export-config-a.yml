name: Agent config A publisher

on:
  push:
    branches: [agent/config-runtime-contract]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-config-a-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/config-runtime-contract
          fetch-depth: 0
      - name: Detect staged patch
        id: patch
        shell: bash
        run: |
          if test -f .agent/config-a.patch.gz.b64; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply, collapse, and publish config contract
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/config-a.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/config-a.patch"
          git apply --check --recount "$RUNNER_TEMP/config-a.patch"
          git apply --recount "$RUNNER_TEMP/config-a.patch"
          rm -rf .agent .github/workflows/agent-source-export-config-a.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset --soft origin/main
          git commit -m 'fix(config): establish one canonical runtime contract'
          git push --force-with-lease origin HEAD:agent/config-runtime-contract
      - name: No patch staged
        if: steps.patch.outputs.present != 'true'
        run: echo 'Publisher is waiting for the config A patch.'
