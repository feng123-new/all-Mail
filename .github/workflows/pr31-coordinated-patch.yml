name: PR31 coordinated patch

on:
  push:
    branches:
      - agent/oauth-session-security
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/oauth-session-security
          fetch-depth: 0
      - name: Apply reviewed source transformations
        run: python3 scripts/pr31_apply.py
      - name: Validate patch
        run: |
          git diff --check
          test -n "$(git status --short)"
      - name: Commit coordinated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/prisma/schema.prisma \
            server/src/modules/mailbox-user/mailboxPortal.routes.ts \
            server/src/modules/email/email.oauth.service.ts \
            core/internal/businessapi/store.go \
            core/internal/businessapi/server_test.go \
            oauth-temp/README.md
          git commit -m "feat(auth): apply revocable session and least-privilege OAuth patch"
          git push origin HEAD:agent/oauth-session-security
